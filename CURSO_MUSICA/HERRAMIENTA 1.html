<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gimnasio Visual de Música | Método PianoVista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col justify-between bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

    <!-- BARRA SUPERIOR / HEADER -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-2.5 flex flex-wrap items-center justify-between gap-4 shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-black text-lg shadow-md text-white shadow-blue-500/20">
                𝄢
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
                    Gimnasio Visual de Música
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Método Bloques y Vectores</span>
                </h1>
                <p class="text-[11px] text-slate-400">Inspirado en PianoVista &middot; Melodías con Cifrado Sajón</p>
            </div>
        </div>

        <!-- SELECTOR DE CAPAS VISUALES -->
        <div class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700/70 shadow-inner">
            <button id="mode-pianovista" class="btn-mode active px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1.5" title="Muestra la partitura con bloques naranja y cápsulas azules">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                Modo Bloques (PianoVista)
            </button>
            <button id="mode-skeleton" class="btn-mode px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5" title="Borra el pentagrama para ver solo el esqueleto geométrico">
                <span class="w-2 h-2 rounded-full bg-pink-500"></span>
                Modo Esqueleto (Quirófano)
            </button>
            <button id="mode-traditional" class="btn-mode px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1.5" title="Partitura clásica en blanco y negro">
                <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                Tradicional
            </button>
        </div>

        <!-- SELECTOR DE PIEZAS Y STATUS MIDI -->
        <div class="flex items-center gap-3">
            <select id="song-select" class="bg-slate-800 text-xs font-semibold border border-slate-700 rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <option value="to_all_the_girls">To All The Girls I've Loved Before (Tu PDF)</option>
                <option value="chopin">Chopin: Vals en La menor (8 compases)</option>
                <option value="intervals">Beethoven: Himno de la Alegría</option>
            </select>

            <div id="midi-status" class="text-xs font-medium px-2.5 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700 transition-colors">
                MIDI: Esperando teclado...
            </div>
        </div>
    </header>

    <!-- ZONA CENTRAL: VISOR MULTI-SISTEMA (LEAD SHEET CON CIFRADO SAJÓN) -->
    <main class="flex-1 flex flex-col justify-start items-center px-4 py-2 max-w-7xl mx-auto w-full overflow-y-auto">
        
        <!-- CONTENEDOR DE PARTITURA -->
        <div class="w-full score-board p-4 relative flex flex-col items-center justify-start min-h-[440px] max-h-[58vh] overflow-y-auto">
            <div id="score-container" class="w-full">
                <!-- SVG renderizado continuo -->
            </div>
        </div>

        <!-- BARRA DE CONTROLES DE PRÁCTICA -->
        <div class="w-full mt-2 bg-slate-900/80 border border-slate-800/80 rounded-xl p-2 flex flex-wrap items-center justify-between gap-4">
            <!-- Transporte -->
            <div class="flex items-center gap-2">
                <button id="btn-play" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white px-4 py-1.5 rounded-lg text-xs font-bold flex items-center shadow-md shadow-emerald-900/30">
                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Escuchar
                </button>
                <button id="btn-stop" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                </button>
            </div>

            <!-- BPM -->
            <div class="flex items-center gap-3 bg-slate-950/60 px-3 py-1 rounded-lg border border-slate-800">
                <span class="text-xs font-semibold text-slate-400">Tempo:</span>
                <input id="bpm-slider" type="range" min="40" max="140" value="84" class="w-24 accent-blue-500 cursor-pointer">
                <span class="text-xs font-mono font-bold text-blue-400 w-12"><span id="bpm-val">84</span> BPM</span>
            </div>

            <div class="text-[11px] text-slate-400">
                <span>Acordes sajones: <strong>C</strong> (Do Mayor), <strong>Dm</strong> (Re menor), <strong>G7</strong> (Sol 7ª).</span>
            </div>
        </div>
    </main>

    <!-- TECLADO DE PIANO INTERACTIVO -->
    <footer class="bg-slate-900 border-t border-slate-800 py-1.5 px-4 shadow-2xl flex flex-col items-center">
        <div class="w-full max-w-5xl overflow-x-auto pb-1 flex justify-center">
            <div id="piano-keys" class="piano-keyboard relative">
                <!-- Teclas con geometría anatómica exacta -->
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/audio.js"></script>
    <script src="js/midi.js"></script>
    <script src="js/songs/to_all_the_girls.js"></script>
    <script src="js/songs/chopin_valse.js"></script>
    <script src="js/songs/intervals.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
