<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Visual - Clave de Sol (3 Sistemas)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px 18px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.35rem;
            color: #e6edf3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f85149;
        }

        .dot.connected {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .btn-secondary { background: #30363d; }
        .btn-danger { background: #da3633; }

        /* TABLERO DE PARTITURA COMPLETA CON 3 PENTAGRAMAS */
        .staff-board {
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px solid #30363d;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 580px;
        }

        /* PIE DE PÁGINA MINIMALISTA */
        footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 0.88rem;
            color: #8b949e;
        }

        .key-hint {
            background: #21262d;
            border: 1px solid #444c56;
            padding: 2px 8px;
            border-radius: 4px;
            color: #58a6ff;
            font-weight: 700;
        }

        .revealed-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
            min-width: 120px;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎼 Partitura Continua - Clave de Sol <span>(3 Pentagramas)</span></h1>
        <div class="controls-bar">
            <div class="status-badge">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Conectando MIDI...</span>
            </div>
            <button class="btn btn-secondary" id="btn-sound" onclick="toggleSound()">🔊 Sonido: ON</button>
            <button class="btn btn-danger" onclick="clearNotes()">🗑️ Limpiar Todo</button>
        </div>
    </header>

    <div class="staff-board">
        <!-- SVG QUE DIBUJA 3 PENTAGRAMAS COMPLETOS (SISTEMAS) -->
        <svg id="staffSvg" viewBox="0 0 1800 680" preserveAspectRatio="none">
            <!-- SISTEMA 1 (Y base primera línea = 130) -->
            <!-- Líneas: 50, 70, 90, 110, 130 -->
            <line x1="20" y1="50" x2="1780" y2="50" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="70" x2="1780" y2="70" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="90" x2="1780" y2="90" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="110" x2="1780" y2="110" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="130" x2="1780" y2="130" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="50" x2="1780" y2="130" stroke="#222" stroke-width="3" />
            <text x="40" y="122" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 2 (Y base primera línea = 350) -->
            <!-- Líneas: 270, 290, 310, 330, 350 -->
            <line x1="20" y1="270" x2="1780" y2="270" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="290" x2="1780" y2="290" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="310" x2="1780" y2="310" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="330" x2="1780" y2="330" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="350" x2="1780" y2="350" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="270" x2="1780" y2="350" stroke="#222" stroke-width="3" />
            <text x="40" y="342" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 3 (Y base primera línea = 570) -->
            <!-- Líneas: 490, 510, 530, 550, 570 -->
            <line x1="20" y1="490" x2="1780" y2="490" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="510" x2="1780" y2="510" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="530" x2="1780" y2="530" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="550" x2="1780" y2="550" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="570" x2="1780" y2="570" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="490" x2="1780" y2="570" stroke="#222" stroke-width="3" />
            <text x="40" y="562" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- Capa donde se dibujan las notas -->
            <g id="notes-layer"></g>

            <g id="welcome-hint">
                <text x="900" y="95" text-anchor="middle" font-size="20" fill="#888" font-style="italic">
                    Toca tu Akai: caben hasta 90 notas en 3 pentagramas. Usa Backspace (⌫) para borrar errores ➔
                </text>
            </g>
        </svg>
    </div>

    <footer>
        <div>
            ⌨️ Borrar error: <span class="key-hint">Backspace / ⌫</span>
        </div>
        <div class="revealed-text" id="note-reveal">&nbsp;</div>
        <label class="toggle-container">
            <input type="checkbox" id="check-show-name" onchange="toggleShowName()">
            <span>Comprobar nota (mostrar solución)</span>
        </label>
    </footer>

    <script>
        let soundEnabled = true;
        let audioCtx = null;
        let showNoteName = false;
        let lastPlayedNote = null;

        const activeKeysMap = new Set();
        const noteSequence = [];

        // Cada pentagrama aloja 30 notas (3 x 30 = 90 notas en pantalla)
        const NOTES_PER_STAFF = 30;
        const TOTAL_MAX_NOTES = 90;
        const START_X = 140;
        const NOTE_STEP_X = 54;

        // Coordenadas Y de la 1ª línea (Mi4) para cada pentagrama
        const STAFF_LINE1_Y = [130, 350, 570];

        const NOTE_NAMES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
        const DIATONIC_STEPS = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];

        function getDiatonicStep(midi) {
            const octave = Math.floor(midi / 12) - 1;
            const noteInOct = midi % 12;
            const octDiff = octave - 4;
            return (octDiff * 7) + DIATONIC_STEPS[noteInOct] - 2;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playSound(midi) {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById("btn-sound");
            btn.textContent = soundEnabled ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            btn.classList.toggle("btn-secondary", !soundEnabled);
        }

        function toggleShowName() {
            showNoteName = document.getElementById("check-show-name").checked;
            renderNoteName();
        }

        function renderNoteName() {
            const revealEl = document.getElementById("note-reveal");
            if (lastPlayedNote !== null && showNoteName) {
                const name = NOTE_NAMES[lastPlayedNote % 12];
                const oct = Math.floor(lastPlayedNote / 12) - 1;
                revealEl.textContent = `${name} (${oct})`;
            } else {
                revealEl.innerHTML = "&nbsp;";
            }
        }

        function deleteLastNote() {
            if (noteSequence.length > 0) {
                noteSequence.pop();
                lastPlayedNote = noteSequence.length > 0 ? noteSequence[noteSequence.length - 1] : null;
                renderNotesLayer();
                renderNoteName();
                if (noteSequence.length === 0) {
                    document.getElementById("welcome-hint").style.display = "block";
                }
            }
        }

        function clearNotes() {
            noteSequence.length = 0;
            lastPlayedNote = null;
            renderNotesLayer();
            renderNoteName();
            document.getElementById("welcome-hint").style.display = "block";
        }

        // CAPTURA DIRECTA DE BACKSPACE
        window.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" || e.code === "Backspace") {
                e.preventDefault();
                deleteLastNote();
            }
        }, true);

        function triggerNoteOn(midi) {
            if (activeKeysMap.has(midi)) return;
            activeKeysMap.add(midi);

            lastPlayedNote = midi;
            playSound(midi);
            renderNoteName();

            document.getElementById("welcome-hint").style.display = "none";
            noteSequence.push(midi);

            // Al llenar los 3 pentagramas completos (90 notas), se desplaza
            if (noteSequence.length > TOTAL_MAX_NOTES) {
                noteSequence.shift();
            }

            renderNotesLayer();
        }

        function triggerNoteOff(midi) {
            activeKeysMap.delete(midi);
        }

        function renderNotesLayer() {
            const layer = document.getElementById("notes-layer");
            let svg = "";

            noteSequence.forEach((midi, index) => {
                const isLast = (index === noteSequence.length - 1);

                // Determinar en qué pentagrama (0, 1 o 2) va la nota
                const staffIndex = Math.floor(index / NOTES_PER_STAFF);
                const posInStaff = index % NOTES_PER_STAFF;

                const posX = START_X + (posInStaff * NOTE_STEP_X);
                const baseLineY = STAFF_LINE1_Y[staffIndex];
                const step = getDiatonicStep(midi);
                const noteY = baseLineY - (step * 10);
                const isSharp = [1, 3, 6, 8, 10].includes(midi % 12);

                // Líneas adicionales inferiores
                if (step <= -2) {
                    for (let s = -2; s >= step; s -= 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                // Líneas adicionales superiores
                if (step >= 10) {
                    for (let s = 10; s <= step; s += 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                // Sostenido (#)
                if (isSharp) {
                    svg += `<text x="${posX - 16}" y="${noteY + 7}" font-size="22" font-weight="bold" fill="#e63946" text-anchor="end">♯</text>`;
                }

                let noteFill = isLast ? (isSharp ? "#e63946" : "#0969da") : "#111111";
                svg += `<ellipse cx="${posX}" cy="${noteY}" rx="12" ry="8.5" fill="${noteFill}" stroke="#111" stroke-width="1.8" transform="rotate(-20 ${posX} ${noteY})" />`;

                if (step < 4) {
                    svg += `<line x1="${posX + 10}" y1="${noteY - 2}" x2="${posX + 10}" y2="${noteY - 50}" stroke="#111" stroke-width="2.2" />`;
                } else {
                    svg += `<line x1="${posX - 10}" y1="${noteY + 2}" x2="${posX - 10}" y2="${noteY + 50}" stroke="#111" stroke-width="2.2" />`;
                }
            });

            layer.innerHTML = svg;
        }

        let midiAccessInstance = null;

        async function setupMIDI() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (!navigator.requestMIDIAccess) {
                text.textContent = "Web MIDI no soportado";
                return;
            }

            try {
                midiAccessInstance = await navigator.requestMIDIAccess({ sysex: false });
                
                function bindInputs() {
                    const inputs = Array.from(midiAccessInstance.inputs.values());
                    if (inputs.length > 0) {
                        dot.classList.add("connected");
                        text.textContent = `Conectado: ${inputs.map(i => i.name).join(", ")}`;
                    } else {
                        dot.classList.remove("connected");
                        text.textContent = "Conecta el Akai LPK25 por USB";
                    }

                    inputs.forEach(input => {
                        input.onmidimessage = (e) => {
                            const [status, note, vel] = e.data;
                            const cmd = status >> 4;
                            if (cmd === 9) {
                                if (vel > 0) triggerNoteOn(note);
                                else triggerNoteOff(note);
                            } else if (cmd === 8) {
                                triggerNoteOff(note);
                            }
                        };
                    });
                }

                bindInputs();
                midiAccessInstance.onstatechange = bindInputs;
            } catch (err) {
                dot.classList.remove("connected");
                text.textContent = "Acceso MIDI no disponible";
            }
        }

        setupMIDI();
        window.addEventListener("click", () => initAudio(), { once: true });
    </script>
</body>
</html>
