<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Visual - Clave de Sol</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px 20px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
        }

        h1 {
            font-size: 1.4rem;
            color: #e6edf3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f85149;
        }

        .dot.connected {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #30363d; }
        .btn-secondary:hover { background: #3c444d; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #b62324; }

        .main-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* PENTAGRAMA EXTRA ANCHO */
        .staff-board {
            background: #ffffff;
            border-radius: 10px;
            padding: 10px 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            border: 2px solid #30363d;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: 290px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .training-guide {
            font-size: 0.95rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-hint {
            background: #21262d;
            border: 1px solid #444c56;
            padding: 3px 10px;
            border-radius: 5px;
            color: #58a6ff;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        .revealed-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #58a6ff;
            min-width: 110px;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #8b949e;
            cursor: pointer;
        }

        .piano-wrapper {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .keyboard {
            display: flex;
            position: relative;
            user-select: none;
            overflow-x: auto;
            max-width: 100%;
            padding: 4px;
        }

        .white-key {
            width: 30px;
            height: 90px;
            background: #fcfcfc;
            border: 1px solid #222;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .white-key.active { background: #388bfd !important; }

        .black-key {
            width: 18px;
            height: 56px;
            background: #151515;
            border: 1px solid #000;
            border-radius: 0 0 3px 3px;
            margin-left: -10px;
            margin-right: -10px;
            z-index: 2;
            cursor: pointer;
        }
        .black-key.active { background: #ff7b72 !important; }
    </style>
</head>
<body>

    <header>
        <h1>🎼 Entrenador Clave de Sol <span>(Panorámico)</span></h1>
        <div class="controls-bar">
            <div class="status-badge">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Conectando MIDI...</span>
            </div>
            <button class="btn btn-secondary" id="btn-sound" onclick="toggleSound()">🔊 Sonido: ON</button>
            <button class="btn btn-danger" onclick="clearNotes()">🗑️ Limpiar Todo</button>
        </div>
    </header>

    <div class="main-container">
        <!-- PENTAGRAMA EXTRA ANCHO -->
        <div class="staff-board">
            <svg id="staffSvg" viewBox="0 0 1800 250" preserveAspectRatio="none">
                <line x1="20" y1="65" x2="1780" y2="65" stroke="#222" stroke-width="2.5" />
                <line x1="20" y1="85" x2="1780" y2="85" stroke="#222" stroke-width="2.5" />
                <line x1="20" y1="105" x2="1780" y2="105" stroke="#222" stroke-width="2.5" />
                <line x1="20" y1="125" x2="1780" y2="125" stroke="#222" stroke-width="2.5" />
                <line x1="20" y1="145" x2="1780" y2="145" stroke="#222" stroke-width="2.5" />
                <line x1="1780" y1="65" x2="1780" y2="145" stroke="#222" stroke-width="3" />

                <!-- Clave de Sol -->
                <text x="40" y="137" font-size="115" font-family="serif" fill="#111">𝄞</text>

                <!-- Capa de notas -->
                <g id="notes-layer"></g>

                <g id="welcome-hint">
                    <text x="900" y="110" text-anchor="middle" font-size="20" fill="#888" font-style="italic">
                        Toca tu Akai: si te equivocas, pulsa la tecla Backspace (⌫) en tu Mac para borrar ➔
                    </text>
                </g>
            </svg>
        </div>

        <div class="bottom-bar">
            <div class="training-guide">
                ⌨️ Pulsa la tecla física <span class="key-hint">Backspace / ⌫</span> en tu Mac para borrar la última nota
            </div>
            <div class="revealed-text" id="note-reveal">&nbsp;</div>
            <label class="toggle-container">
                <input type="checkbox" id="check-show-name" onchange="toggleShowName()">
                <span>Comprobar nota (mostrar nombre si dudo)</span>
            </label>
        </div>

        <div class="piano-wrapper">
            <div class="keyboard" id="keys-box"></div>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        let audioCtx = null;
        let showNoteName = false;
        let lastPlayedNote = null;

        const activeKeysMap = new Set();
        const noteSequence = [];

        const START_X = 140;
        const NOTE_STEP_X = 50;
        const MAX_NOTES_ON_SCREEN = 32;

        const NOTE_NAMES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
        const DIATONIC_STEPS = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];

        function getDiatonicStep(midi) {
            const octave = Math.floor(midi / 12) - 1;
            const noteInOct = midi % 12;
            const octDiff = octave - 4;
            return (octDiff * 7) + DIATONIC_STEPS[noteInOct] - 2;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playSound(midi) {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById("btn-sound");
            btn.textContent = soundEnabled ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            btn.classList.toggle("btn-secondary", !soundEnabled);
        }

        function toggleShowName() {
            showNoteName = document.getElementById("check-show-name").checked;
            renderNoteName();
        }

        function renderNoteName() {
            const revealEl = document.getElementById("note-reveal");
            if (lastPlayedNote !== null && showNoteName) {
                const name = NOTE_NAMES[lastPlayedNote % 12];
                const oct = Math.floor(lastPlayedNote / 12) - 1;
                revealEl.textContent = `${name} (${oct})`;
            } else {
                revealEl.innerHTML = "&nbsp;";
            }
        }

        function deleteLastNote() {
            if (noteSequence.length > 0) {
                noteSequence.pop();
                lastPlayedNote = noteSequence.length > 0 ? noteSequence[noteSequence.length - 1] : null;
                renderNotesLayer();
                renderNoteName();
                if (noteSequence.length === 0) {
                    document.getElementById("welcome-hint").style.display = "block";
                }
            }
        }

        function clearNotes() {
            noteSequence.length = 0;
            lastPlayedNote = null;
            renderNotesLayer();
            renderNoteName();
            document.getElementById("welcome-hint").style.display = "block";
        }

        // CAPTURA DIRECTA Y GLOBAL DE LA TECLA BACKSPACE
        window.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" || e.code === "Backspace") {
                e.preventDefault();
                deleteLastNote();
            }
        }, true);

        function triggerNoteOn(midi) {
            if (activeKeysMap.has(midi)) return;
            activeKeysMap.add(midi);

            lastPlayedNote = midi;
            playSound(midi);
            renderNoteName();

            document.getElementById("welcome-hint").style.display = "none";
            noteSequence.push(midi);

            if (noteSequence.length > MAX_NOTES_ON_SCREEN) {
                noteSequence.shift();
            }

            renderNotesLayer();
            highlightKey(midi, true);
        }

        function triggerNoteOff(midi) {
            activeKeysMap.delete(midi);
            highlightKey(midi, false);
        }

        function renderNotesLayer() {
            const layer = document.getElementById("notes-layer");
            let svg = "";

            noteSequence.forEach((midi, index) => {
                const isLast = (index === noteSequence.length - 1);
                const posX = START_X + (index * NOTE_STEP_X);
                const step = getDiatonicStep(midi);
                const noteY = 145 - (step * 10);
                const isSharp = [1, 3, 6, 8, 10].includes(midi % 12);

                if (step <= -2) {
                    for (let s = -2; s >= step; s -= 2) {
                        const ly = 145 - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                if (step >= 10) {
                    for (let s = 10; s <= step; s += 2) {
                        const ly = 145 - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                if (isSharp) {
                    svg += `<text x="${posX - 16}" y="${noteY + 7}" font-size="22" font-weight="bold" fill="#e63946" text-anchor="end">♯</text>`;
                }

                let noteFill = isLast ? (isSharp ? "#e63946" : "#0969da") : "#111111";
                svg += `<ellipse cx="${posX}" cy="${noteY}" rx="12" ry="8.5" fill="${noteFill}" stroke="#111" stroke-width="1.8" transform="rotate(-20 ${posX} ${noteY})" />`;

                if (step < 4) {
                    svg += `<line x1="${posX + 10}" y1="${noteY - 2}" x2="${posX + 10}" y2="${noteY - 52}" stroke="#111" stroke-width="2.2" />`;
                } else {
                    svg += `<line x1="${posX - 10}" y1="${noteY + 2}" x2="${posX - 10}" y2="${noteY + 52}" stroke="#111" stroke-width="2.2" />`;
                }
            });

            layer.innerHTML = svg;
        }

        function highlightKey(midi, active) {
            const el = document.getElementById(`k-${midi}`);
            if (el) {
                if (active) el.classList.add("active");
                else el.classList.remove("active");
            }
        }

        let midiAccessInstance = null;

        async function setupMIDI() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (!navigator.requestMIDIAccess) {
                text.textContent = "Web MIDI no soportado";
                return;
            }

            try {
                midiAccessInstance = await navigator.requestMIDIAccess({ sysex: false });
                
                function bindInputs() {
                    const inputs = Array.from(midiAccessInstance.inputs.values());
                    if (inputs.length > 0) {
                        dot.classList.add("connected");
                        text.textContent = `Conectado: ${inputs.map(i => i.name).join(", ")}`;
                    } else {
                        dot.classList.remove("connected");
                        text.textContent = "Conecta el Akai LPK25 por USB";
                    }

                    inputs.forEach(input => {
                        input.onmidimessage = (e) => {
                            const [status, note, vel] = e.data;
                            const cmd = status >> 4;
                            if (cmd === 9) {
                                if (vel > 0) triggerNoteOn(note);
                                else triggerNoteOff(note);
                            } else if (cmd === 8) {
                                triggerNoteOff(note);
                            }
                        };
                    });
                }

                bindInputs();
                midiAccessInstance.onstatechange = bindInputs;
            } catch (err) {
                dot.classList.remove("connected");
                text.textContent = "Acceso MIDI no disponible";
            }
        }

        function buildKeys() {
            const box = document.getElementById("keys-box");
            box.innerHTML = "";
            for (let m = 48; m <= 84; m++) {
                const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
                const k = document.createElement("div");
                k.id = `k-${m}`;
                k.className = isBlack ? "black-key" : "white-key";
                k.onmousedown = () => triggerNoteOn(m);
                k.onmouseup = () => triggerNoteOff(m);
                k.onmouseleave = () => triggerNoteOff(m);
                box.appendChild(k);
            }
        }

        buildKeys();
        setupMIDI();
        window.addEventListener("click", () => initAudio(), { once: true });
    </script>
</body>
</html>
