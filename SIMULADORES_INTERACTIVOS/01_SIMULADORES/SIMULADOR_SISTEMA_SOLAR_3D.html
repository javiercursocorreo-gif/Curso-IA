<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión 05 • NASA Eyes: Sistema Solar Interactivo en Tiempo Real [COD-005]</title>
    <!-- Fuentes Tipográficas Oficiales -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #02040a;
            --bg-panel: rgba(8, 14, 26, 0.94);
            --solar-gold: #fbbf24;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --font-title: 'Cinzel', serif;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        header {
            background: linear-gradient(180deg, rgba(8, 14, 26, 0.98) 0%, rgba(8, 14, 26, 0.90) 100%);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.35);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
        }

        .header-title-box { display: flex; align-items: center; gap: 12px; }
        .badge-code {
            background: rgba(251, 191, 36, 0.18);
            color: var(--solar-gold);
            border: 1px solid rgba(251, 191, 36, 0.5);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.05em;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nasa {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
            border: 1px solid #fbbf24;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }
        .btn-nasa:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.80rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.18s;
        }
        .btn-quick:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
            color: #fff;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe#nasaEyesFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* BARRA INFERIOR DE ACCESOS RÁPIDOS */
        .bottom-nav {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 14, 26, 0.90);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 9999px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            z-index: 40;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .bottom-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--solar-gold);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-right: 4px;
        }
        .nav-pill {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text-sub);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .nav-pill:hover, .nav-pill.active {
            background: rgba(251, 191, 36, 0.22);
            border-color: var(--solar-gold);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-box">
            <span class="badge-code">COD-005</span>
            <div>
                <h1>☀️ Sistema Solar Interactivo en Tiempo Real • NASA Eyes</h1>
            </div>
        </div>
        <div class="header-controls">
            <a href="https://eyes.nasa.gov/apps/solar-system/#/home" target="_blank" class="btn-nasa">
                🚀 Abrir en NASA Eyes Oficial ↗
            </a>
            <button class="btn-quick" onclick="toggleFullscreen()" title="Pantalla Completa">
                ⛶ Pantalla Completa
            </button>
        </div>
    </header>

    <div class="iframe-container" id="frameBox">
        <iframe 
            id="nasaEyesFrame"
            src="https://eyes.nasa.gov/apps/solar-system/#/home?embed=true" 
            allowfullscreen 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>

        <!-- Selector Rápido de Planetas -->
        <div class="bottom-nav">
            <span class="bottom-label">🪐 Planetas:</span>
            <button class="nav-pill active" onclick="loadTarget('home')">Vista Global</button>
            <button class="nav-pill" onclick="loadTarget('sun')">Sol</button>
            <button class="nav-pill" onclick="loadTarget('mercury')">Mercurio</button>
            <button class="nav-pill" onclick="loadTarget('venus')">Venus</button>
            <button class="nav-pill" onclick="loadTarget('earth')">Tierra</button>
            <button class="nav-pill" onclick="loadTarget('mars')">Marte</button>
            <button class="nav-pill" onclick="loadTarget('jupiter')">Júpiter</button>
            <button class="nav-pill" onclick="loadTarget('saturn')">Saturno</button>
            <button class="nav-pill" onclick="loadTarget('uranus')">Urano</button>
            <button class="nav-pill" onclick="loadTarget('neptune')">Neptuno</button>
        </div>
    </div>

    <script>
        function loadTarget(target) {
            const frame = document.getElementById('nasaEyesFrame');
            frame.src = `https://eyes.nasa.gov/apps/solar-system/#/${target}?embed=true`;
            document.querySelectorAll('.nav-pill').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleFullscreen() {
            const box = document.getElementById('frameBox');
            if (!document.fullscreenElement) {
                box.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
