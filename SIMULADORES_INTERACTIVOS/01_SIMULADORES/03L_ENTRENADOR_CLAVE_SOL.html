<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3L - Entrenador Visual Clave de Sol (Sesión 3L)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #21262d;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tag-3l {
            background: #1f6feb;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.25rem;
            color: #e6edf3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f85149;
            transition: all 0.3s;
        }

        .dot.connected {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #30363d; }
        .btn-primary { background: #1f6feb; }
        .btn-danger { background: #da3633; }
        .btn-purple { background: #8957e5; }
        .btn-active-mic { background: #e3b341; color: #111; font-weight: 700; box-shadow: 0 0 10px #e3b341; }

        /* BARRA SECUNDARIA DE MODO Y PARTITURA */
        .mode-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            margin-bottom: 6px;
            font-size: 0.84rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mode-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-input {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .practice-indicator {
            background: #0d1117;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #30363d;
            font-size: 0.8rem;
            font-weight: 600;
            color: #58a6ff;
            display: none;
        }

        /* TABLERO DE PARTITURA COMPLETA CON 3 PENTAGRAMAS */
        .staff-board {
            background: #ffffff;
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px solid #30363d;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 520px;
        }

        /* PIE DE PÁGINA */
        footer {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.83rem;
            color: #8b949e;
            flex-wrap: wrap;
            gap: 10px;
        }

        .key-hint {
            background: #21262d;
            border: 1px solid #444c56;
            padding: 2px 7px;
            border-radius: 4px;
            color: #58a6ff;
            font-weight: 700;
        }

        .check-options {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .label-radio {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #c9d1d9;
            font-weight: 500;
        }
        .label-radio input { accent-color: #1f6feb; cursor: pointer; }

        /* TECLADO EN PANTALLA (PLEGABLE / OPCIONAL) */
        #virtual-keyboard-container {
            display: none;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px;
            margin-top: 4px;
            justify-content: center;
            overflow-x: auto;
        }

        .piano-keys {
            display: flex;
            position: relative;
            height: 70px;
            user-select: none;
        }

        .white-key {
            width: 28px;
            height: 100%;
            background: #ffffff;
            border: 1px solid #333;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #666;
        }
        .white-key.active { background: #58a6ff !important; color: #fff; }
        .white-key.error { background: #f85149 !important; color: #fff; }

        .black-key {
            width: 18px;
            height: 44px;
            background: #222;
            border-radius: 0 0 3px 3px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
        }
        .black-key.active { background: #1f6feb !important; }
        .black-key.error { background: #da3633 !important; }

        /* FEEDBACK ROJO ERROR ANIMATION */
        @keyframes shakeNote {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(-1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .note-error-shake {
            animation: shakeNote 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-box">
            <span class="tag-3l">SESIÓN 3L</span>
            <h1>🎼 Entrenador Clave de Sol <span>(3 Pentagramas)</span></h1>
        </div>
        <div class="controls-bar">
            <div class="status-badge">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Conectando MIDI...</span>
            </div>
            <button class="btn btn-secondary" id="btn-mic" onclick="toggleVoiceDetection()">🎤 Voz (Mic): OFF</button>
            <button class="btn btn-secondary" id="btn-sound" onclick="toggleSound()">🔊 Sonido: ON</button>
            <button class="btn btn-danger" onclick="clearNotes()">🗑️ Limpiar / Reset</button>
        </div>
    </header>

    <!-- BARRA DE MODO, CANCIONES Y PRÁCTICA -->
    <div class="mode-bar">
        <div class="mode-group">
            <label style="color:#8b949e; font-weight:600;">Modo:</label>
            <select class="select-input" id="select-mode" onchange="changeMode()">
                <option value="free">🎹 Modo Libre (Tocar y ver)</option>
                <option value="wait" selected>🎯 Modo Práctica (Espera / "Wait for Note")</option>
                <option value="intervals">🎲 Ejercicio Intervalos (3ªs y 5ªs)</option>
            </select>
        </div>

        <div class="mode-group" id="song-controls-group">
            <label style="color:#8b949e; font-weight:600;">Partitura:</label>
            <select class="select-input" id="select-song" onchange="loadSelectedSong()">
                <option value="">-- Elige una canción --</option>
                <option value="alegria">Himno de la Alegría (Beethoven)</option>
                <option value="estrellita">Estrellita dónde estás (Mozart)</option>
                <option value="campana">Campana sobre Campana</option>
                <option value="martinillo">Frère Jacques (Martinillo)</option>
                <option value="escala_do">Escala Do Mayor (Do4 a Do5)</option>
            </select>

            <button class="btn btn-primary" onclick="triggerFileInput()">📂 Cargar .MID</button>
            <input type="file" id="midi-file-input" accept=".mid,.midi" style="display:none" onchange="handleMidiFileUpload(event)">
            
            <button class="btn btn-purple" id="btn-new-exercise" style="display:none;" onclick="generateIntervalExercise()">🎲 Nuevo Ejercicio</button>
        </div>

        <div class="practice-indicator" id="practice-status-badge">
            Nota: <span id="current-note-target" style="color:#fff;">--</span> (<span id="practice-step-count">0/0</span>)
        </div>
    </div>

    <div class="staff-board" id="staff-board-dropzone" ondragover="event.preventDefault()" ondrop="handleDropMidi(event)">
        <!-- SVG QUE DIBUJA 3 PENTAGRAMAS COMPLETOS (SISTEMAS) -->
        <svg id="staffSvg" viewBox="0 0 1800 680" preserveAspectRatio="none">
            <!-- SISTEMA 1 (Y base primera línea = 130) -->
            <line x1="20" y1="50" x2="1780" y2="50" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="70" x2="1780" y2="70" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="90" x2="1780" y2="90" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="110" x2="1780" y2="110" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="130" x2="1780" y2="130" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="50" x2="1780" y2="130" stroke="#222" stroke-width="3" />
            <text x="40" y="122" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 2 (Y base primera línea = 350) -->
            <line x1="20" y1="270" x2="1780" y2="270" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="290" x2="1780" y2="290" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="310" x2="1780" y2="310" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="330" x2="1780" y2="330" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="350" x2="1780" y2="350" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="270" x2="1780" y2="350" stroke="#222" stroke-width="3" />
            <text x="40" y="342" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 3 (Y base primera línea = 570) -->
            <line x1="20" y1="490" x2="1780" y2="490" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="510" x2="1780" y2="510" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="530" x2="1780" y2="530" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="550" x2="1780" y2="550" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="570" x2="1780" y2="570" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="490" x2="1780" y2="570" stroke="#222" stroke-width="3" />
            <text x="40" y="562" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- Capa donde se dibujan las notas -->
            <g id="notes-layer"></g>

            <g id="welcome-hint">
                <text x="900" y="95" text-anchor="middle" font-size="20" fill="#888" font-style="italic">
                    [Sesión 3L] Toca tu Akai / Korg o canta por micrófono: la partitura te espera en cada nota ➔
                </text>
            </g>
        </svg>
    </div>

    <!-- TECLADO EN PANTALLA OPCIONAL (DESACTIVADO POR DEFECTO PARA NO OCUPAR ESPACIO) -->
    <div id="virtual-keyboard-container">
        <div class="piano-keys" id="piano-keys-layer"></div>
    </div>

    <footer>
        <div>
            ⌨️ Borrar nota: <span class="key-hint">Backspace / ⌫</span>
        </div>
        <div class="check-options">
            <span style="color:#8b949e; font-weight:600;">Nombre de Notas:</span>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="none" onchange="setNoteLabelMode('none')">
                <span>Oculto</span>
            </label>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="below" onchange="setNoteLabelMode('below')">
                <span>Debajo del pentagrama</span>
            </label>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="on_note" checked onchange="setNoteLabelMode('on_note')">
                <span style="color:#58a6ff; font-weight:bold;">🎯 Sobre la figura</span>
            </label>
            
            <label class="label-radio" style="margin-left: 10px;">
                <input type="checkbox" id="toggle-vkey" onchange="toggleVirtualKeyboard()">
                <span>🎹 Teclado en pantalla (opcional)</span>
            </label>
        </div>
    </footer>

    <script>
        // CONFIGURACIÓN Y ESTADOS GLOBALES
        let soundEnabled = true;
        let audioCtx = null;
        let noteLabelMode = 'on_note'; // 'none', 'below', 'on_note'
        let currentMode = 'wait'; // 'free', 'wait', 'intervals'
        let isMicActive = false;
        let micStream = null;
        let micAnalyser = null;
        let micInterval = null;

        const activeKeysMap = new Set();
        const noteSequence = []; // Modo libre
        let practiceSequence = []; // Secuencia de notas del ejercicio o canción
        let currentStepIndex = 0; // Índice de la nota actual a tocar en modo práctica
        let hasErrorOnCurrentStep = false; // Flag para feedback en ROJO

        const NOTES_PER_STAFF = 30;
        const TOTAL_MAX_NOTES = 90;
        const START_X = 140;
        const NOTE_STEP_X = 54;
        const STAFF_LINE1_Y = [130, 350, 570];

        const NOTE_NAMES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
        const SHORT_NOTE_NAMES = ["DO", "DO#", "RE", "RE#", "MI", "FA", "FA#", "SOL", "SOL#", "LA", "LA#", "SI"];
        const DIATONIC_STEPS = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];

        // CANCIONES PRECARGADAS DIDÁCTICAS (Números MIDI)
        const PRELOADED_SONGS = {
            alegria: [64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 64, 62, 62, 64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 62, 60, 60],
            estrellita: [60, 60, 67, 67, 69, 69, 67, 65, 65, 64, 64, 62, 62, 60, 67, 67, 65, 65, 64, 64, 62, 67, 67, 65, 65, 64, 64, 62],
            campana: [67, 67, 67, 67, 69, 67, 65, 64, 62, 64, 65, 67, 65, 64, 62, 60, 67, 67, 67, 67, 69, 67, 65, 64, 62, 64, 65, 67, 65, 64],
            martinillo: [60, 62, 64, 60, 60, 62, 64, 60, 64, 65, 67, 64, 65, 67, 67, 69, 67, 65, 64, 60, 67, 69, 67, 65, 64, 60, 60, 55, 60, 60],
            escala_do: [60, 62, 64, 65, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60]
        };

        function getDiatonicStep(midi) {
            const octave = Math.floor(midi / 12) - 1;
            const noteInOct = midi % 12;
            const octDiff = octave - 4;
            return (octDiff * 7) + DIATONIC_STEPS[noteInOct] - 2;
        }

        // MOTOR DE AUDIO (Web Audio API)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playSound(midi, isError = false) {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (isError) {
                // Tono disonante corto de error
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
                return;
            }

            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.65);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.65);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById("btn-sound");
            btn.textContent = soundEnabled ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            btn.classList.toggle("btn-secondary", !soundEnabled);
        }

        function setNoteLabelMode(mode) {
            noteLabelMode = mode;
            renderNotesLayer();
        }

        function changeMode() {
            currentMode = document.getElementById("select-mode").value;
            const songGroup = document.getElementById("song-controls-group");
            const newExBtn = document.getElementById("btn-new-exercise");
            const songSelect = document.getElementById("select-song");
            const badge = document.getElementById("practice-status-badge");

            if (currentMode === "free") {
                songGroup.style.display = "none";
                badge.style.display = "none";
                document.getElementById("welcome-hint").style.display = noteSequence.length === 0 ? "block" : "none";
            } else if (currentMode === "wait") {
                songGroup.style.display = "flex";
                newExBtn.style.display = "none";
                songSelect.style.display = "inline-block";
                badge.style.display = "inline-block";
                document.getElementById("welcome-hint").style.display = "none";
                if (practiceSequence.length === 0) {
                    loadSongByKey("alegria");
                }
            } else if (currentMode === "intervals") {
                songGroup.style.display = "flex";
                newExBtn.style.display = "inline-block";
                songSelect.style.display = "none";
                badge.style.display = "inline-block";
                document.getElementById("welcome-hint").style.display = "none";
                generateIntervalExercise();
            }
            renderNotesLayer();
            updatePracticeStatusUI();
        }

        // CARGA DE CANCIONES
        function loadSelectedSong() {
            const key = document.getElementById("select-song").value;
            if (key) {
                loadSongByKey(key);
            }
        }

        function loadSongByKey(key) {
            if (PRELOADED_SONGS[key]) {
                practiceSequence = [...PRELOADED_SONGS[key]];
                currentStepIndex = 0;
                hasErrorOnCurrentStep = false;
                document.getElementById("welcome-hint").style.display = "none";
                updatePracticeStatusUI();
                renderNotesLayer();
            }
        }

        // GENERADOR PROCEDURAL DE EJERCICIOS CON INTERVALOS DE 3ªS Y 5ªS
        function generateIntervalExercise() {
            // Rango Clave de Sol: Do4 (60) a Sol5 (79)
            // Intervalos permitidos: 0 (unísono), 1 o 2 semitonos (2da), 3 o 4 (3ra), 7 (5ta)
            const allowedIntervals = [-7, -4, -3, -2, -1, 0, 1, 2, 3, 4, 7];
            const diatonicScale = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79]; // Do4 a Sol5
            
            const exerciseNotes = [];
            let currentIdx = Math.floor(diatonicScale.length / 2); // empieza en Sol4 (67)
            exerciseNotes.push(diatonicScale[currentIdx]);

            for (let i = 1; i < 20; i++) {
                // Saltos en peldaños diatónicos: 0 (unísono), ±1 (2da), ±2 (3ra), ±4 (5ta)
                const diatonicJumps = [-4, -2, -1, 0, 1, 2, 4];
                const jump = diatonicJumps[Math.floor(Math.random() * diatonicJumps.length)];
                let nextIdx = currentIdx + jump;
                if (nextIdx < 0) nextIdx = 0;
                if (nextIdx >= diatonicScale.length) nextIdx = diatonicScale.length - 1;
                
                exerciseNotes.push(diatonicScale[nextIdx]);
                currentIdx = nextIdx;
            }

            practiceSequence = exerciseNotes;
            currentStepIndex = 0;
            hasErrorOnCurrentStep = false;
            document.getElementById("welcome-hint").style.display = "none";
            updatePracticeStatusUI();
            renderNotesLayer();
        }

        function updatePracticeStatusUI() {
            const badge = document.getElementById("practice-status-badge");
            const noteTargetEl = document.getElementById("current-note-target");
            const countEl = document.getElementById("practice-step-count");

            if (currentMode === "free") {
                badge.style.display = "none";
                return;
            }

            badge.style.display = "inline-block";
            if (practiceSequence.length > 0 && currentStepIndex < practiceSequence.length) {
                const targetMidi = practiceSequence[currentStepIndex];
                noteTargetEl.textContent = NOTE_NAMES[targetMidi % 12];
                countEl.textContent = `${currentStepIndex + 1}/${practiceSequence.length}`;
            } else if (practiceSequence.length > 0 && currentStepIndex >= practiceSequence.length) {
                noteTargetEl.textContent = "🎉 ¡Completado!";
                countEl.textContent = `${practiceSequence.length}/${practiceSequence.length}`;
            } else {
                noteTargetEl.textContent = "--";
                countEl.textContent = "0/0";
            }
        }

        // GESTIÓN DE NOTAS PULSADAS / INTERACCIÓN
        function triggerNoteOn(midi) {
            if (activeKeysMap.has(midi)) return;
            activeKeysMap.add(midi);

            highlightVirtualKey(midi, true);

            if (currentMode === "free") {
                // Modo Libre
                playSound(midi);
                document.getElementById("welcome-hint").style.display = "none";
                noteSequence.push(midi);
                if (noteSequence.length > TOTAL_MAX_NOTES) {
                    noteSequence.shift();
                }
                renderNotesLayer();
            } else {
                // Modo Práctica (Wait for note) o Ejercicios
                if (practiceSequence.length === 0) return;

                if (currentStepIndex < practiceSequence.length) {
                    const targetMidi = practiceSequence[currentStepIndex];
                    
                    // Comprobación exacta de nota (o misma nota en cualquier octava si se prefiere, aquí afinación exacta)
                    if (midi === targetMidi || (midi % 12 === targetMidi % 12)) {
                        // ¡CORRECTO!
                        hasErrorOnCurrentStep = false;
                        playSound(midi);
                        currentStepIndex++;
                        updatePracticeStatusUI();
                        renderNotesLayer();

                        if (currentStepIndex >= practiceSequence.length) {
                            setTimeout(() => {
                                alert("🎉 ¡Excelente trabajo! Has completado toda la partitura con éxito.");
                            }, 300);
                        }
                    } else {
                        // ¡INCORRECTO! (Feedback en ROJO)
                        hasErrorOnCurrentStep = true;
                        playSound(midi, true); // Sonido sutil de error
                        flashErrorKey(midi);
                        renderNotesLayer();
                    }
                }
            }
        }

        function triggerNoteOff(midi) {
            activeKeysMap.delete(midi);
            highlightVirtualKey(midi, false);
        }

        function deleteLastNote() {
            if (currentMode === "free") {
                if (noteSequence.length > 0) {
                    noteSequence.pop();
                    renderNotesLayer();
                    if (noteSequence.length === 0) {
                        document.getElementById("welcome-hint").style.display = "block";
                    }
                }
            } else {
                if (currentStepIndex > 0) {
                    currentStepIndex--;
                    hasErrorOnCurrentStep = false;
                    updatePracticeStatusUI();
                    renderNotesLayer();
                }
            }
        }

        function clearNotes() {
            if (currentMode === "free") {
                noteSequence.length = 0;
                document.getElementById("welcome-hint").style.display = "block";
            } else {
                currentStepIndex = 0;
                hasErrorOnCurrentStep = false;
                updatePracticeStatusUI();
            }
            renderNotesLayer();
        }

        // CAPTURA DIRECTA DE BACKSPACE
        window.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" || e.code === "Backspace") {
                e.preventDefault();
                deleteLastNote();
            }
        }, true);

        // RENDERIZADO VECTORIAL SVG DE NOTAS
        function renderNotesLayer() {
            const layer = document.getElementById("notes-layer");
            let svg = "";

            const activeList = (currentMode === "free") ? noteSequence : practiceSequence;

            activeList.forEach((midi, index) => {
                const staffIndex = Math.floor(index / NOTES_PER_STAFF);
                const posInStaff = index % NOTES_PER_STAFF;
                if (staffIndex >= 3) return; // Máximo 3 pentagramas

                const posX = START_X + (posInStaff * NOTE_STEP_X);
                const baseLineY = STAFF_LINE1_Y[staffIndex];
                const step = getDiatonicStep(midi);
                const noteY = baseLineY - (step * 10);
                const isSharp = [1, 3, 6, 8, 10].includes(midi % 12);
                const noteName = NOTE_NAMES[midi % 12];
                const shortName = SHORT_NOTE_NAMES[midi % 12];

                // Líneas adicionales inferiores
                if (step <= -2) {
                    for (let s = -2; s >= step; s -= 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                // Líneas adicionales superiores
                if (step >= 10) {
                    for (let s = 10; s <= step; s += 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 18}" y1="${ly}" x2="${posX + 18}" y2="${ly}" stroke="#222" stroke-width="2.2" />`;
                    }
                }

                // Sostenido (#)
                if (isSharp) {
                    svg += `<text x="${posX - 16}" y="${noteY + 7}" font-size="22" font-weight="bold" fill="#e63946" text-anchor="end">♯</text>`;
                }

                // COLORES Y ESTADO DE LA NOTA
                let noteFill = "#111111";
                let auraSvg = "";

                if (currentMode === "free") {
                    const isLast = (index === noteSequence.length - 1);
                    noteFill = isLast ? (isSharp ? "#e63946" : "#0969da") : "#111111";
                } else {
                    // Modo Práctica / Wait / Intervals
                    if (index < currentStepIndex) {
                        // Ya tocada con acierto (Verde esmeralda elegante)
                        noteFill = "#2ea043";
                    } else if (index === currentStepIndex) {
                        // Nota actual a tocar
                        if (hasErrorOnCurrentStep) {
                            // ¡ERROR! ROJO ALERTA
                            noteFill = "#da3633";
                            auraSvg = `<circle cx="${posX}" cy="${noteY}" r="22" fill="none" stroke="#da3633" stroke-width="3.5" opacity="0.8" class="note-error-shake" />`;
                        } else {
                            // Esperando con aura azul
                            noteFill = "#1f6feb";
                            auraSvg = `<circle cx="${posX}" cy="${noteY}" r="20" fill="none" stroke="#1f6feb" stroke-width="2.5" opacity="0.6"><animate attributeName="r" values="18;23;18" dur="1.4s" repeatCount="indefinite"/></circle>`;
                        }
                    } else {
                        // Pendiente futura
                        noteFill = "#555555";
                    }
                }

                // Dibujar Aura
                if (auraSvg) svg += auraSvg;

                // Cabeza de la figura
                svg += `<ellipse cx="${posX}" cy="${noteY}" rx="12.5" ry="9" fill="${noteFill}" stroke="#111" stroke-width="1.8" transform="rotate(-20 ${posX} ${noteY})" />`;

                // Plica
                if (step < 4) {
                    svg += `<line x1="${posX + 10}" y1="${noteY - 2}" x2="${posX + 10}" y2="${noteY - 48}" stroke="#111" stroke-width="2.2" />`;
                } else {
                    svg += `<line x1="${posX - 10}" y1="${noteY + 2}" x2="${posX - 10}" y2="${noteY + 48}" stroke="#111" stroke-width="2.2" />`;
                }

                // ROTULACIÓN SEGÚN EL MODO ELEGIDO
                if (noteLabelMode === "below") {
                    // Texto debajo de la 1ª línea
                    const textY = baseLineY + 36;
                    svg += `<text x="${posX}" y="${textY}" text-anchor="middle" font-size="13" font-weight="700" fill="#333" font-family="sans-serif">${noteName}</text>`;
                } else if (noteLabelMode === "on_note") {
                    // TEXTO SOBRE LA PROPIA FIGURA (DENTRO DEL ÓVALO)
                    const labelColor = (noteFill === "#ffffff") ? "#111" : "#ffffff";
                    svg += `<text x="${posX}" y="${noteY + 4.2}" text-anchor="middle" font-size="9" font-weight="900" fill="${labelColor}" font-family="sans-serif" style="pointer-events:none;">${shortName}</text>`;
                }
            });

            layer.innerHTML = svg;
        }

        // DETECCIÓN POR VOZ (MICRÓFONO CON PITCH DETECTION)
        let lastDetectedNoteTime = 0;
        let candidateNote = null;

        async function toggleVoiceDetection() {
            const btn = document.getElementById("btn-mic");
            if (isMicActive) {
                // Apagar
                isMicActive = false;
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                if (micInterval) clearInterval(micInterval);
                btn.textContent = "🎤 Voz (Mic): OFF";
                btn.classList.remove("btn-active-mic");
                btn.classList.add("btn-secondary");
            } else {
                // Activar
                initAudio();
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioCtx.createMediaStreamSource(micStream);
                    micAnalyser = audioCtx.createAnalyser();
                    micAnalyser.fftSize = 2048;
                    source.connect(micAnalyser);

                    isMicActive = true;
                    btn.textContent = "🎙️ Voz: ESCUCHANDO...";
                    btn.classList.remove("btn-secondary");
                    btn.classList.add("btn-active-mic");

                    startPitchDetectionLoop();
                } catch (err) {
                    alert("No se pudo acceder al micrófono. Asegúrate de dar permisos en el navegador.");
                }
            }
        }

        function startPitchDetectionLoop() {
            const buffer = new Float32Array(micAnalyser.fftSize);

            function analyze() {
                if (!isMicActive) return;
                micAnalyser.getFloatTimeDomainData(buffer);
                const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

                if (pitch !== -1 && pitch > 80 && pitch < 900) {
                    // Convertir Hz a MIDI
                    const midiNote = Math.round(69 + 12 * Math.log2(pitch / 440));
                    
                    if (midiNote >= 48 && midiNote <= 84) {
                        const now = Date.now();
                        if (candidateNote === midiNote) {
                            if (now - lastDetectedNoteTime > 180) { // Estable por 180 ms
                                triggerNoteOn(midiNote);
                                setTimeout(() => triggerNoteOff(midiNote), 250);
                                candidateNote = null;
                            }
                        } else {
                            candidateNote = midiNote;
                            lastDetectedNoteTime = now;
                        }
                    }
                }
                requestAnimationFrame(analyze);
            }
            requestAnimationFrame(analyze);
        }

        // ALGORITMO DE AUTOCORRELACIÓN PARA PITCH DETECTION
        function autoCorrelate(buf, sampleRate) {
            let size = buf.length;
            let rms = 0;
            for (let i = 0; i < size; i++) {
                const val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / size);
            if (rms < 0.015) return -1; // Muy silencioso

            let r1 = 0, r2 = size - 1, thres = 0.2;
            for (let i = 0; i < size / 2; i++) {
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < size / 2; i++) {
                if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
            }

            buf = buf.slice(r1, r2);
            size = buf.length;

            const c = new Array(size).fill(0);
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size - i; j++) {
                    c[i] = c[i] + buf[j] * buf[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < size; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            return sampleRate / T0;
        }

        // IMPORTADOR DE ARCHIVOS MIDI (.MID) DRAG & DROP Y FILE INPUT
        function triggerFileInput() {
            document.getElementById("midi-file-input").click();
        }

        function handleMidiFileUpload(e) {
            const file = e.target.files[0];
            if (file) parseMidiFile(file);
        }

        function handleDropMidi(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith(".mid") || file.name.endsWith(".midi"))) {
                parseMidiFile(file);
            }
        }

        function parseMidiFile(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const parsedNotes = extractNotesFromMidiData(data);
                    if (parsedNotes.length > 0) {
                        practiceSequence = parsedNotes.slice(0, TOTAL_MAX_NOTES);
                        currentStepIndex = 0;
                        hasErrorOnCurrentStep = false;
                        document.getElementById("select-mode").value = "wait";
                        currentMode = "wait";
                        document.getElementById("welcome-hint").style.display = "none";
                        updatePracticeStatusUI();
                        renderNotesLayer();
                        alert(`🎶 Partitura MIDI cargada con éxito: ${practiceSequence.length} notas listas para practicar.`);
                    } else {
                        alert("No se detectaron notas en el archivo MIDI seleccionado.");
                    }
                } catch (err) {
                    alert("Error al decodificar el archivo MIDI.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // PARSER MIDI INTEGRADO EN JS PURO (Extrae eventos Note-On)
        function extractNotesFromMidiData(bytes) {
            const notes = [];
            let i = 0;
            // Buscar cabecera MThd
            if (String.fromCharCode(...bytes.slice(0, 4)) !== "MThd") return notes;
            i += 14; // Saltar cabecera

            while (i < bytes.length) {
                if (i + 8 > bytes.length) break;
                const chunkType = String.fromCharCode(...bytes.slice(i, i + 4));
                const chunkLength = (bytes[i+4] << 24) | (bytes[i+5] << 16) | (bytes[i+6] << 8) | bytes[i+7];
                i += 8;

                if (chunkType === "MTrk") {
                    const trackEnd = i + chunkLength;
                    let runningStatus = 0;

                    while (i < trackEnd) {
                        // Delta time (variable length)
                        let delta = 0;
                        while (i < trackEnd) {
                            const b = bytes[i++];
                            delta = (delta << 7) | (b & 0x7F);
                            if (!(b & 0x80)) break;
                        }

                        if (i >= trackEnd) break;
                        let status = bytes[i];
                        if (status & 0x80) {
                            runningStatus = status;
                            i++;
                        } else {
                            status = runningStatus;
                        }

                        const eventType = status >> 4;
                        const channel = status & 0x0F;

                        if (status === 0xFF) {
                            // Meta evento
                            const metaType = bytes[i++];
                            let len = 0;
                            while (i < trackEnd) {
                                const b = bytes[i++];
                                len = (len << 7) | (b & 0x7F);
                                if (!(b & 0x80)) break;
                            }
                            i += len;
                        } else if (status === 0xF0 || status === 0xF7) {
                            // Sysex
                            let len = 0;
                            while (i < trackEnd) {
                                const b = bytes[i++];
                                len = (len << 7) | (b & 0x7F);
                                if (!(b & 0x80)) break;
                            }
                            i += len;
                        } else if (eventType === 0x9) {
                            // Note ON
                            const note = bytes[i++];
                            const vel = bytes[i++];
                            if (vel > 0 && channel !== 9) { // Excluir canal 10 de percusión
                                notes.push(note);
                            }
                        } else if (eventType === 0x8 || eventType === 0xA || eventType === 0xB || eventType === 0xE) {
                            i += 2;
                        } else if (eventType === 0xC || eventType === 0xD) {
                            i += 1;
                        }
                    }
                } else {
                    i += chunkLength;
                }
            }
            return notes;
        }

        // TECLADO EN PANTALLA (OPCIONAL)
        function toggleVirtualKeyboard() {
            const container = document.getElementById("virtual-keyboard-container");
            const isChecked = document.getElementById("toggle-vkey").checked;
            container.style.display = isChecked ? "flex" : "none";
            if (isChecked && document.getElementById("piano-keys-layer").children.length === 0) {
                renderVirtualKeyboard();
            }
        }

        function renderVirtualKeyboard() {
            const pianoLayer = document.getElementById("piano-keys-layer");
            pianoLayer.innerHTML = "";
            // Dos octavas: Do4 (60) a Do6 (84)
            const startMidi = 60;
            const endMidi = 84;
            let whiteIndex = 0;

            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (!isBlack) {
                    const whiteKey = document.createElement("div");
                    whiteKey.className = "white-key";
                    whiteKey.dataset.midi = m;
                    whiteKey.textContent = NOTE_NAMES[noteInOct];
                    whiteKey.onmousedown = () => triggerNoteOn(m);
                    whiteKey.onmouseup = () => triggerNoteOff(m);
                    pianoLayer.appendChild(whiteKey);
                    whiteIndex++;
                }
            }

            // Teclas negras superpuestas
            let currentWhiteIdx = 0;
            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (isBlack) {
                    const blackKey = document.createElement("div");
                    blackKey.className = "black-key";
                    blackKey.dataset.midi = m;
                    blackKey.style.left = `${(currentWhiteIdx * 28) - 10}px`;
                    blackKey.onmousedown = () => triggerNoteOn(m);
                    blackKey.onmouseup = () => triggerNoteOff(m);
                    pianoLayer.appendChild(blackKey);
                } else {
                    currentWhiteIdx++;
                }
            }
        }

        function highlightVirtualKey(midi, isActive) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) keyEl.classList.toggle("active", isActive);
        }

        function flashErrorKey(midi) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) {
                keyEl.classList.add("error");
                setTimeout(() => keyEl.classList.remove("error"), 350);
            }
        }

        // INTEGRACIÓN WEB MIDI API (Korg EK-50, Akai LPK25 y compatibles)
        let midiAccessInstance = null;

        async function setupMIDI() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (!navigator.requestMIDIAccess) {
                text.textContent = "Web MIDI no soportado en este navegador";
                return;
            }

            try {
                midiAccessInstance = await navigator.requestMIDIAccess({ sysex: false });
                
                function bindInputs() {
                    const inputs = Array.from(midiAccessInstance.inputs.values());
                    if (inputs.length > 0) {
                        dot.classList.add("connected");
                        text.textContent = `Conectado: ${inputs.map(i => i.name).join(", ")}`;
                    } else {
                        dot.classList.remove("connected");
                        text.textContent = "Conecta el Korg EK-50 / Akai por USB";
                    }

                    inputs.forEach(input => {
                        input.onmidimessage = (e) => {
                            const [status, note, vel] = e.data;
                            const cmd = status >> 4;
                            if (cmd === 9) {
                                if (vel > 0) triggerNoteOn(note);
                                else triggerNoteOff(note);
                            } else if (cmd === 8) {
                                triggerNoteOff(note);
                            }
                        };
                    });
                }

                bindInputs();
                midiAccessInstance.onstatechange = bindInputs;
            } catch (err) {
                dot.classList.remove("connected");
                text.textContent = "Acceso MIDI no disponible";
            }
        }

        // INICIALIZACIÓN
        setupMIDI();
        window.addEventListener("click", () => initAudio(), { once: true });
        
        // Cargar canción por defecto (Himno de la Alegría) en modo práctica al inicio
        loadSongByKey("alegria");
    </script>
