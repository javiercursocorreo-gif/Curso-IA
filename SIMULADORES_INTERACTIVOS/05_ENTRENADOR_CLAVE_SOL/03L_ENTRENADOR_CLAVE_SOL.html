<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎼 Entrenador Clave de Sol</title>
    <!-- Configuración iOS / iPad como App Nativa a pantalla completa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clave de Sol">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23161b22'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%2358a6ff'>𝄞</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #21262d;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tag-3l {
            background: #1f6feb;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.25rem;
            color: #e6edf3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f85149;
            transition: all 0.3s;
        }

        .dot.connected {
            background: #3fb950;
            box-shadow: 0 0 8px #3fb950;
        }

        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #30363d; }
        .btn-primary { background: #1f6feb; }
        .btn-danger { background: #da3633; }
        .btn-purple { background: #8957e5; }
        .btn-active-mic { background: #e3b341; color: #111; font-weight: 700; box-shadow: 0 0 10px #e3b341; }

        /* BARRA SECUNDARIA DE MODO Y PARTITURA */
        .mode-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            margin-bottom: 6px;
            font-size: 0.84rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mode-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-input {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .practice-indicator {
            background: #0d1117;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #30363d;
            font-size: 0.8rem;
            font-weight: 600;
            color: #58a6ff;
            display: none;
        }

        /* TABLERO DE PARTITURA COMPLETA CON 3 PENTAGRAMAS */
        .staff-board {
            background: #ffffff;
            border-radius: 10px;
            padding: 8px 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px solid #30363d;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 520px;
        }

        /* PIE DE PÁGINA */
        footer {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.83rem;
            color: #8b949e;
            flex-wrap: wrap;
            gap: 10px;
        }

        .key-hint {
            background: #21262d;
            border: 1px solid #444c56;
            padding: 2px 7px;
            border-radius: 4px;
            color: #58a6ff;
            font-weight: 700;
        }

        .check-options {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .label-radio {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #c9d1d9;
            font-weight: 500;
        }
        .label-radio input { accent-color: #1f6feb; cursor: pointer; }

        /* TECLADO EN PANTALLA (PLEGABLE / OPCIONAL) */
        #virtual-keyboard-container {
            display: none;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 6px;
            margin-top: 4px;
            justify-content: center;
            overflow-x: auto;
        }

        .piano-keys {
            display: flex;
            position: relative;
            height: 70px;
            user-select: none;
        }

        .white-key {
            width: 28px;
            height: 100%;
            background: #ffffff;
            border: 1px solid #333;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2px;
            font-size: 9px;
            font-weight: bold;
            color: #666;
        }
        .white-key.active { background: #58a6ff !important; color: #fff; }
        .white-key.error { background: #f85149 !important; color: #fff; }

        .black-key {
            width: 18px;
            height: 44px;
            background: #222;
            border-radius: 0 0 3px 3px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
        }
        .black-key.active { background: #1f6feb !important; }
        .black-key.error { background: #da3633 !important; }

        /* FEEDBACK ROJO ERROR ANIMATION */
        @keyframes shakeNote {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(-1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .note-error-shake {
            animation: shakeNote 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-box">
            <span class="tag-3l">SESIÓN 3L</span>
            <h1>🎼 Entrenador Clave de Sol <span>(3 Pentagramas)</span></h1>
        </div>
        <div class="controls-bar">
            <div class="status-badge">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Conectando MIDI...</span>
            </div>
            <button class="btn btn-secondary" id="btn-mic" onclick="toggleVoiceDetection()">🎤 Voz (Mic): OFF</button>
            <button class="btn btn-secondary" id="btn-sound" onclick="toggleSound()">🔊 Sonido: ON</button>
            <button class="btn btn-danger" onclick="clearNotes()">🗑️ Limpiar / Reset</button>
        </div>
    </header>

    <!-- BARRA DE MODO, CANCIONES Y PRÁCTICA -->
    <div class="mode-bar">
        <div class="mode-group">
            <label style="color:#8b949e; font-weight:600;">Modo:</label>
            <select class="select-input" id="select-mode" onchange="changeMode()">
                <option value="free">🎹 Modo Libre (Tocar y ver)</option>
                <option value="wait">🎯 Modo Práctica (Espera / "Wait for Note")</option>
                <option value="intervals" selected>🎲 Ejercicio Intervalos (3ªs y 5ªs)</option>
            </select>
        </div>

        <div class="mode-group" id="song-controls-group">
            <label style="color:#8b949e; font-weight:600;">Partitura:</label>
            <select class="select-input" id="select-song" style="display:none;" onchange="loadSelectedSong()">
                <option value="">-- Elige una canción --</option>
                <option value="alegria">Himno de la Alegría (Beethoven)</option>
                <option value="estrellita">Estrellita dónde estás (Mozart)</option>
                <option value="campana">Campana sobre Campana</option>
                <option value="martinillo">Frère Jacques (Martinillo)</option>
                <option value="escala_do">Escala Do Mayor (Do4 a Do5)</option>
            </select>

            <button class="btn btn-primary" onclick="triggerFileInput()">📂 Cargar .MID</button>
            <input type="file" id="midi-file-input" accept=".mid,.midi" style="display:none" onchange="handleMidiFileUpload(event)">
            
            <button class="btn btn-purple" id="btn-new-exercise" onclick="generateIntervalExercise()">🎲 Nuevo Ejercicio</button>
        </div>

        <div class="practice-indicator" id="practice-status-badge" style="display:inline-block;">
            Nota: <span id="current-note-target" style="color:#fff;">--</span> (<span id="practice-step-count">0/60</span>)
        </div>
    </div>

    <div class="staff-board" id="staff-board-dropzone" ondragover="event.preventDefault()" ondrop="handleDropMidi(event)">
        <!-- SVG QUE DIBUJA 3 PENTAGRAMAS COMPLETOS (SISTEMAS) -->
        <svg id="staffSvg" viewBox="0 0 1800 695" preserveAspectRatio="none" style="overflow: visible;">
            <!-- SISTEMA 1 (Y base primera línea = 130) -->
            <line x1="20" y1="50" x2="1780" y2="50" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="70" x2="1780" y2="70" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="90" x2="1780" y2="90" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="110" x2="1780" y2="110" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="130" x2="1780" y2="130" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="50" x2="1780" y2="130" stroke="#222" stroke-width="3" />
            <text x="40" y="122" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 2 (Y base primera línea = 350) -->
            <line x1="20" y1="270" x2="1780" y2="270" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="290" x2="1780" y2="290" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="310" x2="1780" y2="310" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="330" x2="1780" y2="330" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="350" x2="1780" y2="350" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="270" x2="1780" y2="350" stroke="#222" stroke-width="3" />
            <text x="40" y="342" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- SISTEMA 3 (Y base primera línea = 570) -->
            <line x1="20" y1="490" x2="1780" y2="490" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="510" x2="1780" y2="510" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="530" x2="1780" y2="530" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="550" x2="1780" y2="550" stroke="#222" stroke-width="2.2" />
            <line x1="20" y1="570" x2="1780" y2="570" stroke="#222" stroke-width="2.2" />
            <line x1="1780" y1="490" x2="1780" y2="570" stroke="#222" stroke-width="3" />
            <text x="40" y="562" font-size="105" font-family="serif" fill="#111">𝄞</text>

            <!-- Capa donde se dibujan las notas -->
            <g id="notes-layer"></g>

            <g id="welcome-hint">
                <text x="900" y="95" text-anchor="middle" font-size="20" fill="#888" font-style="italic">
                    [Sesión 3L] Toca tu Akai / Korg o canta por micrófono: la partitura te espera en cada nota ➔
                </text>
            </g>
        </svg>
    </div>

    <!-- TECLADO EN PANTALLA OPCIONAL (DESACTIVADO POR DEFECTO PARA NO OCUPAR ESPACIO) -->
    <div id="virtual-keyboard-container">
        <div class="piano-keys" id="piano-keys-layer"></div>
    </div>

    <footer>
        <div>
            ⌨️ Borrar nota: <span class="key-hint">Backspace / ⌫</span>
        </div>
        <div class="check-options">
            <span style="color:#8b949e; font-weight:600;">Notación:</span>
            <label class="label-radio">
                <input type="radio" name="notation-view-mode" value="simple" checked onchange="setNotationViewMode('simple')">
                <span style="color:#58a6ff; font-weight:bold;">🎯 Lectura Pura (Notas iguales)</span>
            </label>
            <label class="label-radio">
                <input type="radio" name="notation-view-mode" value="rhythm" onchange="setNotationViewMode('rhythm')">
                <span>🎼 Con Ritmo y Compases (Blancas, Negras, Corcheas)</span>
            </label>

            <span style="color:#8b949e; font-weight:600; margin-left: 10px;">Nombre Notas:</span>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="none" checked onchange="setNoteLabelMode('none')">
                <span style="color:#58a6ff; font-weight:bold;">❌ Oculto</span>
            </label>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="below" onchange="setNoteLabelMode('below')">
                <span>Debajo</span>
            </label>
            <label class="label-radio">
                <input type="radio" name="note-label-mode" value="on_note" onchange="setNoteLabelMode('on_note')">
                <span>Sobre figura</span>
            </label>
            
            <label class="label-radio" style="margin-left: 10px;">
                <input type="checkbox" id="toggle-vkey" onchange="toggleVirtualKeyboard()">
                <span>🎹 Teclado (opcional)</span>
            </label>
        </div>
    </footer>

    <script>
        // CONFIGURACIÓN Y ESTADOS GLOBALES
        let soundEnabled = true;
        let audioCtx = null;
        let noteLabelMode = 'none'; // Por defecto OCULTO
        let currentMode = 'intervals'; // Por defecto EJERCICIO DE INTERVALOS
        let isMicActive = false;
        let micStream = null;
        let micAnalyser = null;
        let micInterval = null;

        const activeKeysMap = new Set();
        const noteSequence = []; // Modo libre
        let practiceSequence = []; // Secuencia de notas del ejercicio o canción
        let currentStepIndex = 0; // Índice de la nota actual a tocar en modo práctica
        let hasErrorOnCurrentStep = false; // Flag para feedback en ROJO

        const NOTES_PER_STAFF = 30;
        const TOTAL_MAX_NOTES = 90;
        const START_X = 140;
        const NOTE_STEP_X = 54;
        const STAFF_LINE1_Y = [130, 350, 570];

        const NOTE_NAMES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
        const SHORT_NOTE_NAMES = ["DO", "DO#", "RE", "RE#", "MI", "FA", "FA#", "SOL", "SOL#", "LA", "LA#", "SI"];
        const DIATONIC_STEPS = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];

        // CANCIONES PRECARGADAS DIDÁCTICAS (Números MIDI)
        const PRELOADED_SONGS = {
            hymn_fallen: [67, 71, 74, 72, 71, 69, 67, 66, 67, 69, 71, 67, 69, 71, 74, 76, 74, 71, 69, 67, 69, 71, 69, 67, 67, 71, 74, 72, 71, 69, 67, 66, 67, 69, 71, 67, 69, 71, 74, 76, 74, 72, 71, 69, 67, 66, 67, 67],
            alegria: [64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 64, 62, 62, 64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 62, 60, 60],
            estrellita: [60, 60, 67, 67, 69, 69, 67, 65, 65, 64, 64, 62, 62, 60, 67, 67, 65, 65, 64, 64, 62, 67, 67, 65, 65, 64, 64, 62],
            campana: [67, 67, 67, 67, 69, 67, 65, 64, 62, 64, 65, 67, 65, 64, 62, 60, 67, 67, 67, 67, 69, 67, 65, 64, 62, 64, 65, 67, 65, 64],
            martinillo: [60, 62, 64, 60, 60, 62, 64, 60, 64, 65, 67, 64, 65, 67, 67, 69, 67, 65, 64, 60, 67, 69, 67, 65, 64, 60, 60, 55, 60, 60],
            escala_do: [60, 62, 64, 65, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60]
        };

        function getDiatonicStep(midi) {
            const octave = Math.floor(midi / 12) - 1;
            const noteInOct = midi % 12;
            const octDiff = octave - 4;
            return (octDiff * 7) + DIATONIC_STEPS[noteInOct] - 2;
        }

        // MOTOR DE AUDIO PROFESIONAL: PIANO DE COLA ACÚSTICO (MODELADO FÍSICO Y ARMÓNICOS)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        // Cache de buffers de audio muestreado real si hay conexión
        const pianoSampleBuffers = {};
        let soundfontReady = false;

        // Intentar cargar muestras de piano de cola en segundo plano
        async function loadGrandPianoSample(midi) {
            if (!soundEnabled || pianoSampleBuffers[midi] !== undefined) return;
            try {
                const noteNameMap = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
                const oct = Math.floor(midi / 12) - 1;
                const nName = noteNameMap[midi % 12] + oct;
                const url = `https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/${nName}.mp3`;
                const resp = await fetch(url);
                if (resp.ok) {
                    const arrayBuf = await resp.arrayBuffer();
                    initAudio();
                    const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
                    pianoSampleBuffers[midi] = audioBuf;
                }
            } catch (e) {
                pianoSampleBuffers[midi] = null; // Fallback al sintetizador acústico
            }
        }

        function playSound(midi, isError = false) {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;

            if (isError) {
                // Tono corto disonante de aviso de error
                const oscErr = audioCtx.createOscillator();
                const gainErr = audioCtx.createGain();
                oscErr.type = "sawtooth";
                oscErr.frequency.setValueAtTime(130, now);
                gainErr.gain.setValueAtTime(0.18, now);
                gainErr.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                oscErr.connect(gainErr);
                gainErr.connect(audioCtx.destination);
                oscErr.start(now);
                oscErr.stop(now + 0.22);
                return;
            }

            // SI LA MUESTRA DE AUDIO REAL DE PIANO DE COLA ESTÁ DISPONIBLE EN CACHÉ, REPRODUCIRLA
            if (pianoSampleBuffers[midi]) {
                const src = audioCtx.createBufferSource();
                const gain = audioCtx.createGain();
                src.buffer = pianoSampleBuffers[midi];
                gain.gain.setValueAtTime(0.85, now);
                src.connect(gain);
                gain.connect(audioCtx.destination);
                src.start(now);
                return;
            } else {
                // Descargar muestra en segundo plano para las siguientes veces
                loadGrandPianoSample(midi);
            }

            // SINTETIZADOR DE MODELADO FÍSICO DE PIANO ACÚSTICO (RICO, CÁLIDO Y REALISTA)
            // Simula las cuerdas acopladas, armónicos pares/impares y el golpe percusivo del macillo
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            const duration = Math.min(2.8, Math.max(1.2, 3.2 - (midi - 48) * 0.05)); // Las notas agudas decaen más rápido

            // Filtro paso bajo dinámico (emula el brillo inicial del golpe que se atenúa hacia la madera)
            const filter = audioCtx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(Math.min(10000, freq * 7), now);
            filter.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 1.5), now + duration);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.55, now);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // 1. ARMÓNICO FUNDAMENTAL + DETUNE CORO (Cuerda doble con ligera desafinación acústica de ±2.5 cents)
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();

            osc1.type = "sine";
            osc1.frequency.setValueAtTime(freq, now);
            osc1.detune.setValueAtTime(-2.5, now); // Cuerda A

            osc2.type = "triangle";
            osc2.frequency.setValueAtTime(freq, now);
            osc2.detune.setValueAtTime(2.5, now);  // Cuerda B

            gain1.gain.setValueAtTime(0.65, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + duration * 0.9);

            osc1.connect(gain1);
            osc2.connect(gain1);
            gain1.connect(filter);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);

            // 2. SEGUNDO ARMÓNICO (Octava superior 2*f0, da riqueza y brillo natural a la cuerda)
            const oscHarm2 = audioCtx.createOscillator();
            const gainHarm2 = audioCtx.createGain();
            oscHarm2.type = "sine";
            oscHarm2.frequency.setValueAtTime(freq * 2, now);
            gainHarm2.gain.setValueAtTime(0.28, now);
            gainHarm2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.55);

            oscHarm2.connect(gainHarm2);
            gainHarm2.connect(filter);
            oscHarm2.start(now);
            oscHarm2.stop(now + duration * 0.55);

            // 3. TERCER ARMÓNICO (3*f0, resonancia de la cuerda)
            const oscHarm3 = audioCtx.createOscillator();
            const gainHarm3 = audioCtx.createGain();
            oscHarm3.type = "sine";
            oscHarm3.frequency.setValueAtTime(freq * 3, now);
            gainHarm3.gain.setValueAtTime(0.12, now);
            gainHarm3.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.35);

            oscHarm3.connect(gainHarm3);
            gainHarm3.connect(filter);
            oscHarm3.start(now);
            oscHarm3.stop(now + duration * 0.35);

            // 4. ATAQUE DEL MACILLO (Transitorio percusivo de 18 ms)
            const strikeOsc = audioCtx.createOscillator();
            const strikeGain = audioCtx.createGain();
            strikeOsc.type = "triangle";
            strikeOsc.frequency.setValueAtTime(freq * 0.5, now);
            strikeGain.gain.setValueAtTime(0.25, now);
            strikeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

            strikeOsc.connect(strikeGain);
            strikeGain.connect(masterGain);
            strikeOsc.start(now);
            strikeOsc.stop(now + 0.025);
        }

        // GENERADOR PROCEDURAL DE EJERCICIOS CON INTERVALOS DE 3ªS Y 5ªS
        function generateIntervalExercise() {
            // Escala diatónica en Clave de Sol:
            // 0: Do4 (60), 1: Re4 (62), 2: Mi4 (64), 3: Fa4 (65), 4: Sol4 (67),
            // 5: La4 (69), 6: Si4 (71), 7: Do5 (72), 8: Re5 (74), 9: Mi5 (76),
            // 10: Fa5 (77), 11: Sol5 (79), 12: La5 (81 -> 1ª LÍNEA COMPLEMENTARIA SUPERIOR)
            const diatonicScale = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81];
            const LA5_IDX = 12; // Índice de La5 (81)
            
            const TOTAL_EXERCISE_NOTES = 60; // 30 notas en pentagrama 1 + 30 notas en pentagrama 2
            const exerciseNotes = [];

            // Generar por frases musicales de 6 a 8 notas que ascienden por 3ªs y 5ªs hacia La5
            while (exerciseNotes.length < TOTAL_EXERCISE_NOTES) {
                // Punto de partida de la frase (Do4, Mi4 o Sol4)
                let currentIdx = Math.floor(Math.random() * 4); // 0 a 3 (Do4 a Fa4)
                exerciseNotes.push(diatonicScale[currentIdx]);

                // Subir hacia La5 mediante saltos de 3ª (+2) y 5ª (+4)
                while (currentIdx < LA5_IDX && exerciseNotes.length < TOTAL_EXERCISE_NOTES) {
                    const jump = (Math.random() > 0.45 && currentIdx <= 8) ? 4 : 2; // 5ª o 3ª hacia arriba
                    currentIdx = Math.min(LA5_IDX, currentIdx + jump);
                    exerciseNotes.push(diatonicScale[currentIdx]);
                    
                    // Si llegamos a La5, podemos repetirla o dar una segunda hacia Sol5 y volver a La5
                    if (currentIdx === LA5_IDX && exerciseNotes.length < TOTAL_EXERCISE_NOTES) {
                        if (Math.random() > 0.4) {
                            exerciseNotes.push(diatonicScale[LA5_IDX]); // Repetir La5 en la línea complementaria
                        }
                        break;
                    }
                }

                // Descenso melódico por 3ªs / 5ªs hacia el centro
                while (currentIdx > 4 && exerciseNotes.length < TOTAL_EXERCISE_NOTES) {
                    const drop = (Math.random() > 0.5) ? -2 : -4; // 3ª o 5ª hacia abajo
                    currentIdx = Math.max(0, currentIdx + drop);
                    exerciseNotes.push(diatonicScale[currentIdx]);
                }
            }

            // Asegurar longitud exacta de 60 notas (30 en pentagrama 1, 30 en pentagrama 2)
            practiceSequence = exerciseNotes.slice(0, TOTAL_EXERCISE_NOTES);
            currentStepIndex = 0;
            hasErrorOnCurrentStep = false;
            document.getElementById("welcome-hint").style.display = "none";
            updatePracticeStatusUI();
            renderNotesLayer();
        }

        function triggerNoteOn(midi) {

                    const rawTarget = practiceSequence[currentStepIndex];
                    const targetMidi = (typeof rawTarget === 'object') ? rawTarget.midi : rawTarget;
                    
                    // Comprobación exacta de nota (o misma nota en cualquier octava si se prefiere, aquí afinación exacta)
                    if (midi === targetMidi || (midi % 12 === targetMidi % 12)) {
                        // ¡CORRECTO!
                        hasErrorOnCurrentStep = false;

                        currentStepIndex++;
                        updatePracticeStatusUI();

                        if (currentStepIndex >= practiceSequence.length) {

                    } else {

                        playSound(midi, true); // Sonido sutil de error
                        flashErrorKey(midi);
                        renderNotesLayer();
                    }
                }
            }
        }

        // RENDERIZADO VECTORIAL SVG DE NOTAS (MODO DIDÁCTICO O MODO RÍTMICO CON COMPASES)
        let notationViewMode = 'simple'; // 'simple' (Lectura Pura) o 'rhythm' (Figuras y Compases)

        function renderNotesLayer() {
            const layer = document.getElementById("notes-layer");
            let svg = "";

            const activeList = (currentMode === "free") ? noteSequence : practiceSequence;

            // En modo rítmico, podemos calcular compases (ej. 4/4: compás cada 4 tiempos o cada 4 notas en ejercicios)
            let currentBarCount = 0;

            activeList.forEach((item, index) => {
                // Compatibilidad: item puede ser un número MIDI (ej. 60) o un objeto {midi: 60, duration: 480, durationType: 'quarter'}
                const midi = (typeof item === 'object') ? item.midi : item;
                const durType = (typeof item === 'object' && item.durationType) ? item.durationType : 'quarter';

                const staffIndex = Math.floor(index / NOTES_PER_STAFF);
                const posInStaff = index % NOTES_PER_STAFF;
                if (staffIndex >= 3) return; // Máximo 3 pentagramas

                const posX = START_X + (posInStaff * NOTE_STEP_X);
                const baseLineY = STAFF_LINE1_Y[staffIndex];
                const step = getDiatonicStep(midi);
                const noteY = baseLineY - (step * 10);
                const isSharp = [1, 3, 6, 8, 10].includes(midi % 12);
                const noteName = NOTE_NAMES[midi % 12];
                const shortName = SHORT_NOTE_NAMES[midi % 12];

                // DIBUJAR LÍNEAS DE COMPÁS (En Modo Rítmico cada 4 notas o tiempos)
                if (notationViewMode === 'rhythm' && posInStaff > 0 && posInStaff % 4 === 0) {
                    const barX = posX - (NOTE_STEP_X / 2);
                    const topY = baseLineY - 80;
                    const botY = baseLineY;
                    svg += `<line x1="${barX}" y1="${topY}" x2="${barX}" y2="${botY}" stroke="#222" stroke-width="2.2" />`;
                }

                // Líneas adicionales inferiores (Do4, etc.)
                if (step <= -2) {
                    for (let s = -2; s >= step; s -= 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 21}" y1="${ly}" x2="${posX + 21}" y2="${ly}" stroke="#111" stroke-width="2.5" />`;
                    }
                }

                // Líneas adicionales superiores (La5, etc.)
                if (step >= 10) {
                    for (let s = 10; s <= step; s += 2) {
                        const ly = baseLineY - (s * 10);
                        svg += `<line x1="${posX - 21}" y1="${ly}" x2="${posX + 21}" y2="${ly}" stroke="#111" stroke-width="2.5" />`;
                    }
                }

                // Sostenido (#)
                if (isSharp) {
                    svg += `<text x="${posX - 16}" y="${noteY + 7}" font-size="22" font-weight="bold" fill="#e63946" text-anchor="end">♯</text>`;
                }

                // COLORES Y ESTADO DE LA NOTA
                let noteColor = "#111111";
                let auraSvg = "";

                if (currentMode === "free") {
                    const isLast = (index === noteSequence.length - 1);
                    noteColor = isLast ? (isSharp ? "#e63946" : "#0969da") : "#111111";
                } else {
                    // Modo Práctica / Wait / Intervals
                    if (index < currentStepIndex) {
                        // Ya tocada con acierto (Verde esmeralda elegante)
                        noteColor = "#2ea043";
                    } else if (index === currentStepIndex) {
                        // Nota actual a tocar
                        if (hasErrorOnCurrentStep) {
                            // ¡ERROR! ROJO ALERTA
                            noteColor = "#da3633";
                            auraSvg = `<circle cx="${posX}" cy="${noteY}" r="22" fill="none" stroke="#da3633" stroke-width="3.5" opacity="0.8" class="note-error-shake" />`;
                        } else {
                            // Esperando con aura azul
                            noteColor = "#1f6feb";
                            auraSvg = `<circle cx="${posX}" cy="${noteY}" r="20" fill="none" stroke="#1f6feb" stroke-width="2.5" opacity="0.6"><animate attributeName="r" values="18;23;18" dur="1.4s" repeatCount="indefinite"/></circle>`;
                        }
                    } else {
                        // Pendiente futura
                        noteColor = "#555555";
                    }
                }

                // Dibujar Aura interactiva
                if (auraSvg) svg += auraSvg;

                // DIFERENCIACIÓN DE FIGURA SEGÚN EL MODO:
                // En modo 'rhythm': 'whole' (redonda, hueca sin plica), 'half' (blanca, hueca con plica), 'quarter' (negra), 'eighth' (corchea con corchete)
                const isHollow = (notationViewMode === 'rhythm' && (durType === 'half' || durType === 'whole'));
                const hasStem = !(notationViewMode === 'rhythm' && durType === 'whole');
                const isEighth = (notationViewMode === 'rhythm' && durType === 'eighth');

                const headFill = isHollow ? "#ffffff" : noteColor;
                const headStroke = isHollow ? noteColor : "#111";
                const strokeWidth = isHollow ? "3" : "1.8";

                // Cabeza de la figura
                svg += `<ellipse cx="${posX}" cy="${noteY}" rx="12.5" ry="9" fill="${headFill}" stroke="${headStroke}" stroke-width="${strokeWidth}" transform="rotate(-20 ${posX} ${noteY})" />`;

                // Plica (Stem)
                if (hasStem) {
                    const stemUp = (step < 4);
                    const stemX = stemUp ? (posX + 10) : (posX - 10);
                    const stemStartY = stemUp ? (noteY - 2) : (noteY + 2);
                    const stemEndY = stemUp ? (noteY - 48) : (noteY + 48);

                    svg += `<line x1="${stemX}" y1="${stemStartY}" x2="${stemX}" y2="${stemEndY}" stroke="${noteColor}" stroke-width="2.2" />`;

                    // Si es CORCHEA, añadir corchete (flag)
                    if (isEighth) {
                        if (stemUp) {
                            svg += `<path d="M ${stemX} ${stemEndY} C ${stemX + 10} ${stemEndY + 12}, ${stemX + 16} ${stemEndY + 22}, ${stemX + 6} ${stemEndY + 34}" fill="none" stroke="${noteColor}" stroke-width="2.5" stroke-linecap="round" />`;
                        } else {
                            svg += `<path d="M ${stemX} ${stemEndY} C ${stemX + 10} ${stemEndY - 12}, ${stemX + 16} ${stemEndY - 22}, ${stemX + 6} ${stemEndY - 34}" fill="none" stroke="${noteColor}" stroke-width="2.5" stroke-linecap="round" />`;
                        }
                    }
                }

                // ROTULACIÓN SEGÚN EL MODO ELEGIDO
                if (noteLabelMode === "below") {
                    const textY = baseLineY + 36;
                    svg += `<text x="${posX}" y="${textY}" text-anchor="middle" font-size="13" font-weight="700" fill="#333" font-family="sans-serif">${noteName}</text>`;
                } else if (noteLabelMode === "on_note") {
                    const labelColor = isHollow ? noteColor : "#ffffff";
                    svg += `<text x="${posX}" y="${noteY + 4.2}" text-anchor="middle" font-size="9" font-weight="900" fill="${labelColor}" font-family="sans-serif" style="pointer-events:none;">${shortName}</text>`;
                }
            });

            layer.innerHTML = svg;
        }

        // DETECCIÓN POR VOZ (MICRÓFONO CON WEB SPEECH RECOGNITION NATIVO Y FLUIDO)
        let speechRecognizer = null;
        let lastSpokenTime = 0;

        // Mapeo directo y rápido de notas musicales
        const FAST_NOTE_MAP = [
            { pitch: 1, keys: ["do sostenido", "dos sostenido", "c#"] },
            { pitch: 3, keys: ["re sostenido", "d#"] },
            { pitch: 6, keys: ["fa sostenido", "f#"] },
            { pitch: 8, keys: ["sol sostenido", "g#"] },
            { pitch: 10, keys: ["la sostenido", "a#"] },
            { pitch: 0, keys: ["do", "dó", "dos", "don", "du", "dou", "to"] },
            { pitch: 2, keys: ["re", "ré", "red", "rey", "res", "rem", "tres", "de", "te"] },
            { pitch: 4, keys: ["mi", "mí", "mis", "mil", "me", "mid", "min", "ni"] },
            { pitch: 5, keys: ["fa", "fas", "fan", "far", "fab", "ha", "pa", "va"] },
            { pitch: 7, keys: ["sol", "sól", "son", "so", "gol", "soul", "sor", "sal", "col", "bol", "zo"] },
            { pitch: 9, keys: ["la", "lá", "las", "lan", "da", "na", "bla"] },
            { pitch: 11, keys: ["si", "sí", "sin", "se", "see", "sea", "fi", "ti", "ci", "fin"] }
        ];

        function parseFastSpokenNote(str, targetPitch) {
            if (!str) return null;
            const s = (" " + str.toLowerCase().replace(/[^a-záéíóúñ0-9#\s]/g, " ") + " ");

            // 1. Si la nota esperada coincide directamente en cualquier parte del texto oído:
            if (targetPitch !== null && targetPitch !== undefined) {
                const targetObj = FAST_NOTE_MAP.find(item => item.pitch === targetPitch);
                if (targetObj) {
                    for (const k of targetObj.keys) {
                        // Buscar la palabra o fragmento
                        if (s.includes(" " + k + " ") || s.includes(k)) {
                            return targetPitch;
                        }
                    }
                }
            }

            // 2. Si no coincide con la nota esperada, buscar qué otra nota dijo
            for (const item of FAST_NOTE_MAP) {
                for (const k of item.keys) {
                    if (s.includes(" " + k + " ") || s.includes(k)) {
                        return item.pitch;
                    }
                }
            }
            return null;
        }

        function toggleVoiceDetection() {
            const btn = document.getElementById("btn-mic");
            if (isMicActive) {
                isMicActive = false;
                if (speechRecognizer) {
                    try { speechRecognizer.stop(); } catch(e){}
                    speechRecognizer = null;
                }
                btn.textContent = "🎤 Voz (Mic): OFF";
                btn.classList.remove("btn-active-mic");
                btn.classList.add("btn-secondary");
            } else {
                initAudio();
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Tu navegador no soporta Speech Recognition nativo. Usa Google Chrome o Safari para el reconocimiento de voz.");
                    return;
                }

                isMicActive = true;
                btn.textContent = "🎙️ Escuchando... Di una nota";
                btn.classList.remove("btn-secondary");
                btn.classList.add("btn-active-mic");

                initSpeechRecognition();
            }
        }

        function initSpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec || !isMicActive) return;

            try {
                if (speechRecognizer) speechRecognizer.abort();
            } catch(e){}

            speechRecognizer = new SpeechRec();
            speechRecognizer.lang = 'es-ES';
            speechRecognizer.continuous = true;
            speechRecognizer.interimResults = true; // Fundamental para reaccionar al milisegundo sin esperar pausas
            speechRecognizer.maxAlternatives = 10;

            speechRecognizer.onstart = () => {
                if (isMicActive) {
                    const btn = document.getElementById("btn-mic");
                    btn.textContent = "🎙️ Escuchando... Di una nota";
                }
            };

            speechRecognizer.onresult = (event) => {
                if (!isMicActive) return;
                const btn = document.getElementById("btn-mic");

                let targetPitchClass = null;
                if (currentMode !== "free" && practiceSequence.length > 0 && currentStepIndex < practiceSequence.length) {
                    const rawTarget = practiceSequence[currentStepIndex];
                    const targetMidi = (typeof rawTarget === 'object') ? rawTarget.midi : rawTarget;
                    targetPitchClass = targetMidi % 12;
                }

                // Evaluar todos los fragmentos devueltos en el evento actual
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    if (!res) continue;

                    // Examinar todas las hipótesis devueltas
                    for (let a = 0; a < res.length; a++) {
                        const transcript = res[a].transcript;
                        const detectedPitch = parseFastSpokenNote(transcript, targetPitchClass);

                        if (detectedPitch !== null) {
                            const now = Date.now();
                            if (now - lastSpokenTime > 180) { // Antirrebote ultra-reactivo de 180ms
                                lastSpokenTime = now;
                                const noteNameHeard = NOTE_NAMES[detectedPitch];

                                if (currentMode !== "free" && practiceSequence.length > 0 && currentStepIndex < practiceSequence.length) {
                                    const rawTarget = practiceSequence[currentStepIndex];
                                    const targetMidi = (typeof rawTarget === 'object') ? rawTarget.midi : rawTarget;
                                    const expectedPitchClass = targetMidi % 12;

                                    if (detectedPitch === expectedPitchClass) {
                                        // ¡ACIERTO INSTANTÁNEO EN TIEMPO REAL!
                                        btn.textContent = `🎙️ ¡"${noteNameHeard}"! ✅ ¡Correcto!`;
                                        hasErrorOnCurrentStep = false;
                                        playSound(targetMidi);
                                        currentStepIndex++;
                                        updatePracticeStatusUI();
                                        renderNotesLayer();

                                        if (currentStepIndex >= practiceSequence.length) {
                                            setTimeout(() => {
                                                alert("🎉 ¡Excelente trabajo! Has completado toda la partitura con éxito.");
                                            }, 300);
                                        }
                                        return;
                                    } else if (res.isFinal) {
                                        const expectedName = NOTE_NAMES[expectedPitchClass];
                                        btn.textContent = `🎙️ "${noteNameHeard}" ❌ (Es ${expectedName})`;
                                        hasErrorOnCurrentStep = true;
                                        playSound(60 + detectedPitch, true);
                                        renderNotesLayer();
                                        return;
                                    }
                                } else {
                                    // Modo Libre
                                    btn.textContent = `🎙️ "${noteNameHeard}"`;
                                    playSound(60 + detectedPitch);
                                    noteSequence.push(60 + detectedPitch);
                                    if (noteSequence.length > TOTAL_MAX_NOTES) noteSequence.shift();
                                    renderNotesLayer();
                                    return;
                                }
                            }
                        }
                    }

                    // Mostrar fragmento en vivo
                    if (res[0] && res[0].transcript) {
                        btn.textContent = `🎙️ Oído: "${res[0].transcript.trim()}"`;
                    }
                }
            };

            speechRecognizer.onerror = (e) => {
                if (!isMicActive) return;
                const btn = document.getElementById("btn-mic");
                if (e.error === 'not-allowed') {
                    btn.textContent = "❌ Micrófono bloqueado (Permite acceso)";
                    isMicActive = false;
                    btn.classList.remove("btn-active-mic");
                    btn.classList.add("btn-secondary");
                } else if (e.error !== 'no-speech') {
                    console.log("Speech recognition notice:", e.error);
                }
            };

            speechRecognizer.onend = () => {
                // Auto-mantener la escucha viva de forma transparente
                if (isMicActive) {
                    try {
                        speechRecognizer.start();
                    } catch(e){
                        setTimeout(() => {
                            if (isMicActive) initSpeechRecognition();
                        }, 200);
                    }
                }
            };

            try {
                speechRecognizer.start();
            } catch(e){}
        }

        // IMPORTADOR DE ARCHIVOS MIDI (.MID) DRAG & DROP Y FILE INPUT
        function triggerFileInput() {
            document.getElementById("midi-file-input").click();
        }

        function handleMidiFileUpload(e) {
            const file = e.target.files[0];
            if (file) parseMidiFile(file);
        }

        function handleDropMidi(e) {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith(".mid") || file.name.endsWith(".midi"))) {
                parseMidiFile(file);
            }
        }

        function parseMidiFile(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const parsedNotes = extractNotesFromMidiData(data);
                    if (parsedNotes.length > 0) {
                        practiceSequence = parsedNotes.slice(0, TOTAL_MAX_NOTES);
                        currentStepIndex = 0;
                        hasErrorOnCurrentStep = false;
                        document.getElementById("select-mode").value = "wait";
                        currentMode = "wait";
                        document.getElementById("welcome-hint").style.display = "none";
                        updatePracticeStatusUI();
                        renderNotesLayer();
                        alert(`🎶 Partitura MIDI cargada con éxito: ${practiceSequence.length} notas listas para practicar.`);
                    } else {
                        alert("No se detectaron notas en el archivo MIDI seleccionado.");
                    }
                } catch (err) {
                    alert("Error al decodificar el archivo MIDI.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // PARSER MIDI INTEGRADO EN JS PURO (Extrae eventos Note-On y calcula duraciones)
        function extractNotesFromMidiData(bytes) {
            const rawNotes = [];
            let i = 0;
            // Buscar cabecera MThd
            if (String.fromCharCode(...bytes.slice(0, 4)) !== "MThd") return [];
            const timeDivision = (bytes[12] << 8) | bytes[13];
            const ticksPerQuarter = (timeDivision > 0 && !(timeDivision & 0x8000)) ? timeDivision : 480;
            i += 14; // Saltar cabecera

            // Estructura para registrar notas activas por canal y tono para medir duración
            const activeNotesMap = new Map();

            while (i < bytes.length) {
                if (i + 8 > bytes.length) break;
                const chunkType = String.fromCharCode(...bytes.slice(i, i + 4));
                const chunkLength = (bytes[i+4] << 24) | (bytes[i+5] << 16) | (bytes[i+6] << 8) | bytes[i+7];
                i += 8;

                if (chunkType === "MTrk") {
                    const trackEnd = i + chunkLength;
                    let runningStatus = 0;
                    let currentTick = 0;

                    while (i < trackEnd) {
                        // Delta time (variable length)
                        let delta = 0;
                        while (i < trackEnd) {
                            const b = bytes[i++];
                            delta = (delta << 7) | (b & 0x7F);
                            if (!(b & 0x80)) break;
                        }
                        currentTick += delta;

                        if (i >= trackEnd) break;
                        let status = bytes[i];
                        if (status & 0x80) {
                            runningStatus = status;
                            i++;
                        } else {
                            status = runningStatus;
                        }

                        const eventType = status >> 4;
                        const channel = status & 0x0F;

                        if (status === 0xFF) {
                            // Meta evento
                            const metaType = bytes[i++];
                            let len = 0;
                            while (i < trackEnd) {
                                const b = bytes[i++];
                                len = (len << 7) | (b & 0x7F);
                                if (!(b & 0x80)) break;
                            }
                            i += len;
                        } else if (status === 0xF0 || status === 0xF7) {
                            // Sysex
                            let len = 0;
                            while (i < trackEnd) {
                                const b = bytes[i++];
                                len = (len << 7) | (b & 0x7F);
                                if (!(b & 0x80)) break;
                            }
                            i += len;
                        } else if (eventType === 0x9) {
                            // Note ON
                            const note = bytes[i++];
                            const vel = bytes[i++];
                            const keyId = `${channel}-${note}`;

                            if (vel > 0 && channel !== 9) { // Note On real (excluir percusión)
                                const noteObj = {
                                    midi: note,
                                    startTick: currentTick,
                                    durationTicks: ticksPerQuarter,
                                    durationType: 'quarter'
                                };
                                rawNotes.push(noteObj);
                                activeNotesMap.set(keyId, noteObj);
                            } else if (vel === 0) {
                                // Note Off expresado como Note On vel=0
                                if (activeNotesMap.has(keyId)) {
                                    const noteObj = activeNotesMap.get(keyId);
                                    const dur = Math.max(ticksPerQuarter / 2, currentTick - noteObj.startTick);
                                    noteObj.durationTicks = dur;
                                    // Clasificar figura según duración en relación al pulso de negra
                                    const ratio = dur / ticksPerQuarter;
                                    if (ratio >= 3.2) noteObj.durationType = 'whole';       // Redonda (4 tiempos)
                                    else if (ratio >= 1.6) noteObj.durationType = 'half';    // Blanca (2 tiempos)
                                    else if (ratio >= 0.75) noteObj.durationType = 'quarter'; // Negra (1 tiempo)
                                    else noteObj.durationType = 'eighth';                     // Corchea (1/2 tiempo)
                                    activeNotesMap.delete(keyId);
                                }
                            }
                        } else if (eventType === 0x8) {
                            // Note OFF
                            const note = bytes[i++];
                            const vel = bytes[i++];
                            const keyId = `${channel}-${note}`;
                            if (activeNotesMap.has(keyId)) {
                                const noteObj = activeNotesMap.get(keyId);
                                const dur = Math.max(ticksPerQuarter / 2, currentTick - noteObj.startTick);
                                noteObj.durationTicks = dur;
                                const ratio = dur / ticksPerQuarter;
                                if (ratio >= 3.2) noteObj.durationType = 'whole';
                                else if (ratio >= 1.6) noteObj.durationType = 'half';
                                else if (ratio >= 0.75) noteObj.durationType = 'quarter';
                                else noteObj.durationType = 'eighth';
                                activeNotesMap.delete(keyId);
                            }
                        } else if (eventType === 0xA || eventType === 0xB || eventType === 0xE) {
                            i += 2;
                        } else if (eventType === 0xC || eventType === 0xD) {
                            i += 1;
                        }
                    }
                } else {
                    i += chunkLength;
                }
            }
            return rawNotes;
        }

        // TECLADO EN PANTALLA (OPCIONAL)
        function toggleVirtualKeyboard() {
            const container = document.getElementById("virtual-keyboard-container");
            const isChecked = document.getElementById("toggle-vkey").checked;
            container.style.display = isChecked ? "flex" : "none";
            if (isChecked && document.getElementById("piano-keys-layer").children.length === 0) {
                renderVirtualKeyboard();
            }
        }

        function renderVirtualKeyboard() {
            const pianoLayer = document.getElementById("piano-keys-layer");
            pianoLayer.innerHTML = "";
            // Dos octavas: Do4 (60) a Do6 (84)
            const startMidi = 60;
            const endMidi = 84;
            let whiteIndex = 0;

            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (!isBlack) {
                    const whiteKey = document.createElement("div");
                    whiteKey.className = "white-key";
                    whiteKey.dataset.midi = m;
                    whiteKey.textContent = NOTE_NAMES[noteInOct];
                    whiteKey.onmousedown = () => triggerNoteOn(m);
                    whiteKey.onmouseup = () => triggerNoteOff(m);
                    pianoLayer.appendChild(whiteKey);
                    whiteIndex++;
                }
            }

            // Teclas negras superpuestas
            let currentWhiteIdx = 0;
            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (isBlack) {
                    const blackKey = document.createElement("div");
                    blackKey.className = "black-key";
                    blackKey.dataset.midi = m;
                    blackKey.style.left = `${(currentWhiteIdx * 28) - 10}px`;
                    blackKey.onmousedown = () => triggerNoteOn(m);
                    blackKey.onmouseup = () => triggerNoteOff(m);
                    pianoLayer.appendChild(blackKey);
                } else {
                    currentWhiteIdx++;
                }
            }
        }

        function highlightVirtualKey(midi, isActive) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) keyEl.classList.toggle("active", isActive);
        }

        function flashErrorKey(midi) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) {
                keyEl.classList.add("error");
                setTimeout(() => keyEl.classList.remove("error"), 350);
            }
        }

        // INTEGRACIÓN WEB MIDI API (Korg EK-50, Akai LPK25 y compatibles)
        let midiAccessInstance = null;

        async function setupMIDI() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (!navigator.requestMIDIAccess) {
                text.textContent = "Web MIDI no soportado en este navegador";
                return;
            }

            try {
                midiAccessInstance = await navigator.requestMIDIAccess({ sysex: false });
                
                function bindInputs() {
                    const inputs = Array.from(midiAccessInstance.inputs.values());
                    if (inputs.length > 0) {
                        dot.classList.add("connected");
                        text.textContent = `Conectado: ${inputs.map(i => i.name).join(", ")}`;
                    } else {
                        dot.classList.remove("connected");
                        text.textContent = "Conecta el Korg EK-50 / Akai por USB";
                    }

                    inputs.forEach(input => {
                        input.onmidimessage = (e) => {
                            const [status, note, vel] = e.data;
                            const cmd = status >> 4;
                            if (cmd === 9) {
                                if (vel > 0) triggerNoteOn(note);
                                else triggerNoteOff(note);
                            } else if (cmd === 8) {
                                triggerNoteOff(note);
                            }
                        };
                    });
                }

                bindInputs();
                midiAccessInstance.onstatechange = bindInputs;
            } catch (err) {
                dot.classList.remove("connected");
                text.textContent = "Acceso MIDI no disponible";
            }
        }

        // INICIALIZACIÓN
        setupMIDI();
        window.addEventListener("click", () => {
            initAudio();
            // Precargar muestras de piano de cola acústico para las notas de Clave de Sol (Do4 a La5)
            [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81].forEach(m => loadGrandPianoSample(m));
        }, { once: true });
        
        // Iniciar por defecto en Modo Ejercicio Intervalos (60 notas en los 2 primeros pentagramas con nombres ocultos)
        changeMode();
    </script>
