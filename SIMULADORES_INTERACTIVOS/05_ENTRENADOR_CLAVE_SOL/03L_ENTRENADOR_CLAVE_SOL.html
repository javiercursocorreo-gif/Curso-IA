        function renderVirtualKeyboard() {
            const pianoLayer = document.getElementById("piano-keys-layer");
            pianoLayer.innerHTML = "";
            // Dos octavas: Do4 (60) a Do6 (84)
            const startMidi = 60;
            const endMidi = 84;
            let whiteIndex = 0;

            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (!isBlack) {
                    const whiteKey = document.createElement("div");
                    whiteKey.className = "white-key";
                    whiteKey.dataset.midi = m;
                    whiteKey.textContent = ""; // Teclas limpias sin nombres de notas
                    
                    // Soporte táctil inmediato para iPad y ratón para Mac
                    whiteKey.addEventListener("touchstart", (e) => { e.preventDefault(); triggerNoteOn(m); }, { passive: false });
                    whiteKey.addEventListener("touchend", (e) => { e.preventDefault(); triggerNoteOff(m); }, { passive: false });
                    whiteKey.onmousedown = () => triggerNoteOn(m);
                    whiteKey.onmouseup = () => triggerNoteOff(m);
                    
                    pianoLayer.appendChild(whiteKey);
                    whiteIndex++;
                }
            }

            // Teclas negras superpuestas (alineadas a los 64px de las blancas)
            let currentWhiteIdx = 0;
            for (let m = startMidi; m <= endMidi; m++) {
                const noteInOct = m % 12;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOct);

                if (isBlack) {
                    const blackKey = document.createElement("div");
                    blackKey.className = "black-key";
                    blackKey.dataset.midi = m;
                    blackKey.style.left = `${(currentWhiteIdx * 64) - 19}px`; // Centrado exacto sobre tecla de 64px
                    
                    // Soporte táctil inmediato para iPad y ratón para Mac
                    blackKey.addEventListener("touchstart", (e) => { e.preventDefault(); triggerNoteOn(m); }, { passive: false });
                    blackKey.addEventListener("touchend", (e) => { e.preventDefault(); triggerNoteOff(m); }, { passive: false });
                    blackKey.onmousedown = () => triggerNoteOn(m);
                    blackKey.onmouseup = () => triggerNoteOff(m);
                    
                    pianoLayer.appendChild(blackKey);
                } else {
                    currentWhiteIdx++;
                }
            }
        }

        function highlightVirtualKey(midi, isActive) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) keyEl.classList.toggle("active", isActive);
        }

        function flashErrorKey(midi) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) {
                keyEl.classList.add("error");
                setTimeout(() => keyEl.classList.remove("error"), 350);
            }
        }

        // INTEGRACIÓN WEB MIDI API (Akai LPK25, Korg EK-50 y teclados USB/Bluetooth)
        let midiAccessInstance = null;

        async function setupMIDI() {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");

            if (!navigator.requestMIDIAccess) {
                dot.style.background = "#58a6ff";
                dot.classList.remove("connected");
                text.textContent = "📱 iPad (Táctil / Mic listo)";
                return;
            }

            try {
                midiAccessInstance = await navigator.requestMIDIAccess({ sysex: false });
                
                function bindInputs() {
                    const inputs = Array.from(midiAccessInstance.inputs.values());
                    if (inputs.length > 0) {
                        dot.style.background = "#3fb950";
                        dot.classList.add("connected");
                        const names = inputs.map(i => i.name || "Teclado MIDI").join(", ");
                        text.textContent = `🟢 Conectado: ${names}`;
                    } else {
                        dot.style.background = "#d29922";
                        dot.classList.remove("connected");
                        text.textContent = "🟡 Conecta el Akai / Korg por USB";
                    }

                    inputs.forEach(input => {
                        const onMidi = (e) => {
                            if (!e || !e.data || e.data.length < 2) return;
                            const status = e.data[0];
                            const note = e.data[1];
                            const vel = (e.data.length > 2) ? e.data[2] : 64;
                            const cmd = status >> 4;
                            if (cmd === 9) {
                                if (vel > 0) triggerNoteOn(note);
                                else triggerNoteOff(note);
                            } else if (cmd === 8) {
                                triggerNoteOff(note);
                            }
                        };
                        input.onmidimessage = onMidi;
                        try { input.addEventListener("midimessage", onMidi); } catch(err){}
                    });
                }

                bindInputs();
                midiAccessInstance.onstatechange = bindInputs;
            } catch (err) {
                dot.style.background = "#d29922";
                dot.classList.remove("connected");
                text.textContent = "🟡 Conecta el Akai / Korg por USB";
            }
        }

        // INICIALIZACIÓN
        setupMIDI();
        window.addEventListener("click", () => {
            initAudio();
            if (!midiAccessInstance && navigator.requestMIDIAccess) setupMIDI();
            // Precargar muestras de piano de cola acústico para las notas de Clave de Sol (Do4 a La5)
            [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81].forEach(m => loadGrandPianoSample(m));
        }, { once: true });
        
        // Iniciar por defecto en Modo Ejercicio Intervalos (60 notas en los 2 primeros pentagramas con nombres ocultos)
        changeMode();
    </script>
</body>
