        let currentIndex = 0;

        function switchSlide(index) {
            if (index < 0 || index >= SLIDES.length) return;
            currentIndex = index;

            // Actualizar botones de pestaña
            document.querySelectorAll(".tab-btn").forEach((btn, i) => {
                btn.classList.toggle("active", i === index);
            });

            const slide = SLIDES[index];

            // Título superior
            document.getElementById("slideTag").textContent = slide.tag;
            document.getElementById("slideTitle").textContent = slide.title;
            document.getElementById("slideCounter").textContent = `${index + 1} / ${SLIDES.length}`;

            // Imagen con transición
            const img = document.getElementById("slideImg");
            img.style.opacity = "0.2";
            setTimeout(() => {
                img.src = slide.filename;
                img.alt = slide.title;
                img.style.opacity = "1";
            }, 120);

            // Modal de zoom
            document.getElementById("modalImg").src = slide.filename;

            // 4 Fichas didácticas
            const colors = ["#34d399", "#fbbf24", "#c084fc", "#38bdf8"];
            const bgs = [
                "rgba(52, 211, 153, 0.15)",
                "rgba(251, 191, 36, 0.15)",
                "rgba(192, 132, 252, 0.15)",
                "rgba(56, 189, 248, 0.15)"
            ];

            const container = document.getElementById("didacticCards");
            container.innerHTML = slide.cards.map((c, i) => `
                <div class="d-card" style="border-top: 2.5px solid ${colors[i]};">
                    <div class="d-card-top">
                        <span class="d-card-title">${c.title}</span>
                        <span class="d-card-badge" style="background:${bgs[i]}; color:${colors[i]};">${c.badge}</span>
                    </div>
                    <div class="d-card-body">${c.body}</div>
                    <div class="d-card-spec" style="border-left-color:${colors[i]};">${c.spec}</div>
                </div>
            `).join("");
        }

        function prevSlide() {
            const nextIdx = (currentIndex - 1 + SLIDES.length) % SLIDES.length;
            switchSlide(nextIdx);
        }

        function nextSlide() {
            const nextIdx = (currentIndex + 1) % SLIDES.length;
            switchSlide(nextIdx);
        }

        function openZoomModal() {
            document.getElementById("modalZoom").classList.add("active");
        }

        function closeZoomModal() {
            document.getElementById("modalZoom").classList.remove("active");
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // CONTROL POR TECLADO (FLECHAS IZQUIERDA / DERECHA / ESC)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") prevSlide();
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "Escape") closeZoomModal();
        });

        // CONTROL TÁCTIL EN IPAD / PANTALLA TÁCTIL (DESLIZAR CON EL DEDO / SWIPE)
        let touchStartX = 0;
        let touchEndX = 0;
        const stage = document.getElementById("stageBox");

        stage.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        stage.addEventListener("touchend", (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 40) {
                if (diff < 0) {
                    nextSlide(); // Deslizar hacia la izquierda avanza
                } else {
                    prevSlide(); // Deslizar hacia la derecha retrocede
                }
            }
        }

        // Inicializar
        switchSlide(0);
    </script>
</body>
</html>
