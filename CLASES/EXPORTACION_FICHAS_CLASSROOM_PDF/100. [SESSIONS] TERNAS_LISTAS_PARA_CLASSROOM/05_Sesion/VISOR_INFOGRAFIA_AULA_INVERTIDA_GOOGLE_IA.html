<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>El Futuro de la Educación según Google IA: El Aula Invertida - Visor HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f3f4f6;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
        }
        #viewport {
            flex: 1;
            margin-top: 60px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
        }
        #viewport:active {
            cursor: grabbing;
        }
        #infografia-img {
            max-width: 95vw;
            max-height: calc(95vh - 70px);
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            user-select: none;
            -webkit-user-drag: none;
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <span class="badge">SESIÓN 05 • INFOGRAFÍA DE ALTA DEFINICIÓN</span>
            <h1>El Futuro de la Educación según Google IA: El Aula Invertida</h1>
        </div>
        <div class="controls">
            <button class="btn" id="btn-zoom-in" title="Acercar">🔍 +</button>
            <button class="btn" id="btn-zoom-out" title="Alejar">🔍 -</button>
            <button class="btn" id="btn-reset" title="Restablecer tamaño">↺ Ajustar</button>
            <a href="1. INFO-005_El_Futuro_de_la_Educacion_segun_Google_IA_El_Aula_Invertida.pdf" target="_blank" class="btn btn-primary" title="Abrir Ficha Guía en PDF">📄 Ficha y Preguntas (PDF) ↗</a>
        </div>
    </header>

    <div id="viewport">
        <img id="infografia-img" src="1. INFO-005_El_Futuro_de_la_Educacion_segun_Google_IA_El_Aula_Invertida.jpg" alt="El Futuro de la Educación según Google IA: El Aula Invertida">
    </div>

    <div class="hint" id="hint">💡 Usa la rueda del ratón o pellizca en la tablet para hacer zoom • Arrastra para explorar</div>

    <script>
        const img = document.getElementById('infografia-img');
        const viewport = document.getElementById('viewport');
        const hint = document.getElementById('hint');

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        function updateTransform() {
            img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function zoom(delta, clientX, clientY) {
            const prevScale = scale;
            scale = Math.min(Math.max(0.6, scale + delta), 4.5);
            updateTransform();
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => zoom(0.3));
        document.getElementById('btn-zoom-out').addEventListener('click', () => zoom(-0.3));
        document.getElementById('btn-reset').addEventListener('click', () => {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.15 : -0.15;
            zoom(delta);
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // SOPORTE TÁCTIL PARA IPAD Y MÓVIL
        let touchStartDist = 0;
        let touchStartScale = 1;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartScale = scale;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.min(Math.max(0.6, touchStartScale * (dist / touchStartDist)), 4.5);
                updateTransform();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => isDragging = false);

        setTimeout(() => {
            if (hint) hint.style.opacity = '0';
        }, 5000);
    </script>
</body>
</html>
