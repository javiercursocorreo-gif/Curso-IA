<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madrid 1905 - Visor Fotográfico Cinemático</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0a09;
      color: #f5f5f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .viewer-container {
      position: relative;
      width: 94vw;
      max-width: 1200px;
      height: 75vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid #292524;
      background: #000;
    }
    .ken-burns {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 30% 60%;
      animation: kenburns 35s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.15) translate(-2%, -3%); }
      100% { transform: scale(1.08) translate(3%, 1%); }
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(28, 25, 23, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #d97706;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
      transition: transform 0.2s;
    }
    .play-btn:hover { transform: scale(1.05); background: #f59e0b; }
    .title-box {
      position: absolute;
      top: 20px;
      left: 24px;
      background: rgba(20, 18, 16, 0.8);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .title-box h1 { font-size: 1.1rem; font-weight: 600; color: #f5f5f4; }
    .title-box p { font-size: 0.75rem; color: #a8a29e; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="viewer-container">
    <img src="https://storage.googleapis.com/producer-app-public/producer/15ee264d-94ce-4583-9b8f-362717a2ec02" alt="Construcción Palacio de Cibeles" class="ken-burns" />
    <div class="overlay"></div>
    <div class="title-box">
      <h1>Madrid, c. 1905</h1>
      <p>Construcción del Palacio de Comunicaciones y Plaza de Cibeles</p>
    </div>
    <div class="controls">
      <button class="play-btn" id="playBtn" onclick="toggleAudio()">
        <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
      <span style="font-size: 0.85rem; color: #e7e5e4;">Música de salón de época</span>
    </div>
  </div>
  <audio id="bgAudio" loop src="https://storage.googleapis.com/producer-app-public/clips/8f871ce9-6b30-4572-b870-739fd818463c.m4a"></audio>
  <script>
    const audio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
      }
    }
  </script>
</body>
</html>
